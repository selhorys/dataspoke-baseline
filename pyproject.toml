[project]
name = "dataspoke"
version = "0.1.0"
description = "DataSpoke — AI-powered sidecar extension for DataHub"
requires-python = "==3.13.*"
dependencies = [
    # API layer
    "authlib>=1.7",
    "fastapi>=0.138",
    "itsdangerous>=2.2",
    "uvicorn[standard]>=0.49",
    "pydantic>=2.13",
    "pydantic[email]>=2.13",
    "pydantic-settings>=2.14",
    "PyJWT>=2.13",
    "passlib[bcrypt]>=1.7",
    "slowapi>=0.1.10",
    "structlog>=26",
    # Shared / data layer
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31",
    "alembic>=1.18",
    # Infrastructure clients
    "aiosmtplib>=5.1",
    "acryl-datahub>=1.6,<2.0",
    "redis[hiredis]>=8.0",
    "pgvector>=0.4",
    "langchain>=1.3,<2",
    "langchain-core>=1.4",
    "langchain-openai>=1.3",
    "langchain-google-genai>=4.2",
    "langchain-anthropic>=1.4",
    "langfuse>=4.12,<5",
    # Ingestion extractors
    "kubernetes>=31,<32",
    "confluent-kafka>=2.14",
    "httpx>=0.28",
    "sqlparse>=0.5",
    "openpyxl>=3.1",
    # Anomaly detection & SLA monitoring
    "prophet>=1.3",
    "scikit-learn>=1.9",
    "pandas>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    "mypy>=2.1",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
