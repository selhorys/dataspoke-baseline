# DataSpoke Umbrella Chart — Production Defaults
# All components enabled with production-grade settings.

# ---------------------------------------------------------------------------
# Global — Bitnami subchart compatibility
# ---------------------------------------------------------------------------
# Bitnami charts (18.x+) refuse to render NOTES.txt when the image reference
# doesn't match their expected `bitnami/<app>` repository. Our PostgreSQL pod
# runs a custom image that layers pgvector + AGE on a `bitnamilegacy/*` base,
# which is still a Bitnami image by construction but trips the heuristic.
# This flag opts out of the sanity check; it does not change runtime security.
global:
  security:
    allowInsecureImages: true

# ---------------------------------------------------------------------------
# Application subcharts
# ---------------------------------------------------------------------------
frontend:
  enabled: true
  replicaCount: 2
  # Eviction resilience — annotation prevents cluster-autoscaler from evicting
  # this pod during scale-in; PDB prevents simultaneous voluntary disruptions.
  podAnnotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  image:
    repository: dataspoke/frontend
    tag: latest
    # Set (via --set-string) by install.sh's digest resolution — see
    # spec/feature/HELM_CHART.md §Digest stamping and this subchart's own
    # templates/_helpers.tpl's frontend.imageRef (a chart-scoped copy of the
    # umbrella's dataspoke.imageRef, kept so this subchart lints and renders
    # standalone). Empty by default: renders "repository:tag".
    digest: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: true
    className: "nginx"  # chart default; install.sh --sets it from DATASPOKE_KUBE_INGRESS_CLASS
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: dataspoke.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: dataspoke-tls
        hosts:
          - dataspoke.example.com
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Scheduling knobs — {{- with }}-guarded in the subchart's deployment.yaml,
  # so an unset key renders nothing. topologySpreadConstraints is deliberately
  # left UNSET here (not an empty list) — the frontend subchart's selector
  # needs .Release.Name, which values.yaml cannot reach, so
  # deployment.yaml supplies a default spread via
  # `{{- with .Values.topologySpreadConstraints }}…{{- else }}…{{- end }}`
  # keyed on `include "frontend.selectorLabels"` (name + release instance) —
  # the same two-key, ScheduleAnyway shape shipped for `api` below. Override
  # by setting frontend.topologySpreadConstraints in your overlay — note the
  # override must be a non-empty list: the template's
  # `{{- with .Values.topologySpreadConstraints }}…{{- else }}…{{- end }}`
  # treats an explicit `[]` as unset and falls through to the shipped default,
  # so there is no way to opt out of the spread entirely (by design —
  # ScheduleAnyway is soft and never leaves a pod Pending, so no off switch is
  # needed). See spec/feature/HELM_CHART.md §Scheduling and spread for the
  # full rationale.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Runtime config consumed server-side by Next.js (injected via ConfigMap;
  # no NEXT_PUBLIC_ prefix — values are not baked at build time).
  config:
    # DataSpoke API base URL — the Next.js server proxies API calls here.
    apiBaseUrl: "https://api.dataspoke.example.com"

api:
  enabled: true
  replicaCount: 2
  # Eviction resilience — annotation prevents cluster-autoscaler from evicting
  # this pod during scale-in; PDB prevents simultaneous voluntary disruptions.
  podAnnotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Init container that waits for PostgreSQL before alembic-migrate and the API
  # process start — prevents OOMKill-style crash-loops on cold or rolling deploy.
  waitForDeps:
    enabled: true
    image: "busybox:1.37"
  image:
    repository: dataspoke/api
    tag: latest
    # Set (via --set-string) by install.sh's digest resolution — see
    # spec/feature/HELM_CHART.md §Digest stamping and templates/_helpers.tpl's
    # dataspoke.imageRef. Empty by default: renders "repository:tag".
    digest: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  service:
    type: ClusterIP
    port: 8002
  ingress:
    enabled: true
    className: "nginx"  # chart default; install.sh --sets it from DATASPOKE_KUBE_INGRESS_CLASS
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: api.dataspoke.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: dataspoke-api-tls
        hosts:
          - api.dataspoke.example.com
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: 2Gi
    limits:
      cpu: "1"
      memory: 1024Mi
      ephemeral-storage: 4Gi
  # Scheduling knobs — {{- with }}-guarded in api-deployment.yaml, so an unset
  # key renders nothing. Let an operator place DataSpoke on dedicated or
  # tainted node pools through their values overlay without patching templates.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Default spread on two topology keys — see spec/feature/HELM_CHART.md
  # §Scheduling and spread for the two load-bearing reasons: (a) a pod-level
  # topologySpreadConstraints REPLACES the scheduler's cluster-level
  # defaultConstraints wholesale under the default defaultingType: System, so
  # a hostname-only constraint would silently remove whatever zone spread
  # these pods got for free — shipping both keys restores it explicitly;
  # (b) ScheduleAnyway rather than DoNotSchedule, because a hard constraint
  # makes the second replica flatly unschedulable on a single-node or
  # single-AZ cluster (every dev install and many small prod clusters).
  #
  # labelSelector mirrors THIS Deployment's own selector — api-deployment.yaml
  # selects on app.kubernetes.io/name: dataspoke-api only (a hardcoded
  # literal, no instance label). A broader selector (e.g. adding an instance
  # label a foreign release also carries) would count foreign pods into the
  # skew calculation, which is why this default lives here as a literal
  # rather than in the template (contrast with the frontend subchart above,
  # whose selector needs .Release.Name and so ships its default from the
  # template instead).
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: dataspoke-api
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: dataspoke-api
  secretReader:
    enabled: true
  migrate:
    # Set to false if migrations are managed externally (e.g. CI job, Flyway).
    enabled: true
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
        ephemeral-storage: 512Mi
      limits:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 512Mi

# ---------------------------------------------------------------------------
# Auth — Google OAuth and cookie settings
# ---------------------------------------------------------------------------
# cookieSecure: true in prod (HTTPS required); values-dev.yaml overrides to false.
# googleClientId: set via operator overlay or --set at install time for prod.
#   In dev, install.sh passes --set-string auth.googleClientId=${DATASPOKE_DEV_GOOGLE_OAUTH_CLIENT_ID}.
#   Rendered into the ConfigMap as DATASPOKE_GOOGLE_OAUTH_CLIENT_ID.
# The paired client secret (DATASPOKE_GOOGLE_OAUTH_CLIENT_SECRET) lives in dataspoke-secrets.
auth:
  cookieSecure: true
  googleClientId: ""

event-consumer:
  # Optional Kafka consumer for DataHub MCL/MCP events. Disabled by default —
  # baseline UC1–UC5 are schedule-driven via Airflow, not event-driven.
  # See spec/feature/BACKEND.md §Kafka Consumers.
  enabled: false
  replicaCount: 1
  podAnnotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
  # maxUnavailable, not minAvailable — with one replica, minAvailable: 1 blocks
  # every voluntary eviction and stalls node drains indefinitely. A consumer
  # group rebalances quickly, so there is no availability to protect. Raise
  # replicaCount past the topic's partition count and the extra pods idle.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  waitForDeps:
    enabled: true
    image: "busybox:1.37"
  # The consumer runs the API image under a `command:` override — no separate
  # image is built for it, and build-image.sh has no event-consumer target.
  # install.sh passes the same registry/tag it passes to api.image.*, so both
  # workloads always run the same revision of src/.
  image:
    repository: dataspoke/api
    tag: latest
    # Set (via --set-string) by install.sh's digest resolution — see
    # spec/feature/HELM_CHART.md §Digest stamping and this subchart's own
    # templates/_helpers.tpl's event-consumer.imageRef (a chart-scoped copy of
    # the umbrella's dataspoke.imageRef, kept so this subchart lints and
    # renders standalone). Empty by default: renders "repository:tag".
    digest: ""
    pullPolicy: IfNotPresent
  # ServiceAccount + secret-reader RBAC for the consumer. annotations is the
  # attachment point for cloud workload identity — required for
  # kafka_sasl_mechanism = AWS_MSK_IAM, which authenticates as an IAM role
  # instead of a typed credential. See values-prod.example.yaml.
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 2Gi
    limits:
      cpu: 500m
      memory: 1024Mi
      ephemeral-storage: 4Gi
  # Scheduling knobs — {{- with }}-guarded in the subchart's deployment.yaml,
  # so an unset key renders nothing. No default topologySpreadConstraints:
  # replicaCount is 1, so there is no sibling pod to spread against.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

# ---------------------------------------------------------------------------
# Infrastructure subcharts
# ---------------------------------------------------------------------------
postgresql:
  enabled: true
  image:
    # Custom image with pgvector + Apache AGE extensions baked in.
    # Built from docker-images/postgres/Dockerfile (bitnami/postgresql:17 runtime base).
    # Override registry/tag for each environment:
    #   dev  → --set-string postgresql.image.repository=<REGISTRY>/postgres --set-string postgresql.image.tag=dev
    #   prod → set to your registry's production image tag
    registry: "docker.io"
    repository: "dataspoke/postgres"
    tag: "17-extensions"
    pullPolicy: IfNotPresent
  # username here is the ONLY thing that actually creates the Postgres role.
  # config.postgres.user below (rendered into the app ConfigMap) must equal
  # it, or the API deploys healthy and then fails Postgres authentication —
  # templates/configmap.yaml fails the render on a mismatch. The role is
  # chart-pinned, not operator-choosable: it also appears as a bare literal in
  # primary.initdb.scripts below (and its copy in values-dev.yaml) and in
  # install.sh's _derive_airflow_metadata_secret, neither of which the render
  # guard reaches.
  # database, unlike the role, is a clean two-site value (this key and
  # config.postgres.db below, guarded against each other at render time) —
  # initdb's scripts run against it as their default connection but never
  # name it as a literal.
  auth:
    username: "dataspoke"
    database: "dataspoke"
    existingSecret: "dataspoke-secrets"
    secretKeys:
      adminPasswordKey: "DATASPOKE_POSTGRES_PASSWORD"
      userPasswordKey: "DATASPOKE_POSTGRES_PASSWORD"
      replicationPasswordKey: "DATASPOKE_POSTGRES_PASSWORD"
  primary:
    # Bitnami postgresql 18.x keys: primary.podAnnotations and primary.pdb
    podAnnotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    pdb:
      create: true
      minAvailable: 1
    resources:
      requests:
        cpu: "1"
        memory: 2048Mi
        ephemeral-storage: 2Gi
      limits:
        cpu: "2"
        memory: 6144Mi
        ephemeral-storage: 4Gi
    persistence:
      size: 50Gi
    # Apache AGE requires shared_preload_libraries so its C hooks load at
    # server startup; without it CREATE EXTENSION succeeds but graph functions
    # fail at runtime with "extension 'age' must be loaded via shared_preload_libraries".
    # Bitnami PG 18.x key: primary.extendedConfiguration (renders as override.conf).
    extendedConfiguration: |
      shared_preload_libraries = 'age'
    initdb:
      # Run the bootstrap scripts as the postgres superuser, not the app user.
      # CREATE EXTENSION (vector, age) is superuser-only, so the default app-user
      # execution fails with "permission denied to create extension". The superuser
      # and app user share one password (adminPasswordKey == userPasswordKey), so
      # the chart's default INITSCRIPTS_PASSWORD (the app password) authenticates
      # the postgres role — no plaintext credential is added here.
      user: postgres
      scripts:
        # Run once at cluster bootstrap. Alembic migrations run `CREATE EXTENSION
        # IF NOT EXISTS` idempotently on every deploy — both are complementary.
        # Extensions are created in the `dataspoke` DB (default connection).
        # AGE and pgvector workloads must therefore connect to the `dataspoke` DB.
        # The 'dataspoke' role literal below is chart-pinned, not
        # operator-choosable: it must match auth.username above and
        # config.postgres.user (rendered into the app ConfigMap, guarded at
        # render time against auth.username in templates/configmap.yaml), and
        # install.sh's _derive_airflow_metadata_secret — none reachable from
        # this initdb SQL. create-airflow-db.sql's database name carries no
        # such third site: it runs against auth.database as the default
        # connection and never names it as a literal, so config.postgres.db +
        # auth.database is a clean, fully-guarded two-site pair.
        01-extensions.sql: |
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE EXTENSION IF NOT EXISTS age;
          -- Allow the dataspoke application role to call AGE graph functions.
          GRANT USAGE ON SCHEMA ag_catalog TO dataspoke;
          GRANT SELECT ON ALL TABLES IN SCHEMA ag_catalog TO dataspoke;
        create-airflow-db.sql: |
          -- Airflow connects as the 'dataspoke' role; make it the DB owner so its
          -- metadata migrations can CREATE TABLE. PostgreSQL 15+ no longer grants
          -- CREATE on the public schema to non-owner roles, so a postgres-owned
          -- airflow DB fails the migration with "permission denied for schema
          -- public". The script runs as the postgres superuser (primary.initdb.user).
          CREATE DATABASE airflow OWNER dataspoke;

redis:
  enabled: true
  # Bitnami moved unversioned tags behind a paywall (August 2025). Use the
  # `bitnamilegacy/*` namespace to keep pulling a free, chart-compatible image.
  # Prod operators may pin this to their own registry mirror.
  image:
    repository: bitnamilegacy/redis
    tag: "8.2.1-debian-12-r0"
  auth:
    enabled: true
    existingSecret: "dataspoke-secrets"
    existingSecretPasswordKey: "DATASPOKE_REDIS_PASSWORD"
  # commonConfiguration applies to master and replica alike. It is a plain
  # SCALAR in the Bitnami chart (redis/values.yaml), so setting it here
  # REPLACES the upstream default wholesale rather than merging with it — the
  # six lines through `save ""` are the upstream directives (redis-25.3.12.tgz
  # redis/values.yaml:200-207) carried forward verbatim; dropping any of them
  # silently disables AOF durability or the ReJSON/RediSearch modules.
  #
  # `maxmemory 256mb` + `maxmemory-policy noeviction`: this Redis is not a pure
  # cache — it also holds refresh-token revocation keys
  # (src/backend/auth/tokens.py is_refresh_revoked) and distributed locks
  # (src/shared/cache/client.py, SET NX + Lua compare-and-delete). An LRU/LFU
  # policy would drop both silently and, by Redis's own logic, "correctly" —
  # they look like cold cache entries. noeviction converts a full dataset into
  # a loud write failure instead. Known asymmetry: the rate limiter
  # (src/api/middleware/rate_limit.py, RATE_LIMIT_REDIS_DB) shares this Redis
  # with in_memory_fallback_enabled=True, so it degrades silently to
  # per-process counting on any RedisError including OOM — the fail-closed
  # auth limiter has no such fallback and answers 503 instead. The limiter's
  # keyspace is the genuinely unbounded, unauthenticated-reachable tenant here
  # (one bucket key per distinct caller-supplied bearer/IP, versus the
  # dataset-count-bounded cache keys); `maxmemory` is instance-wide with no
  # per-logical-DB isolation, so exhausting the limiter's DB can also starve
  # writes on the auth-critical DB (revocation keys, distributed locks) sharing
  # the same budget.
  #
  # `maxmemory` sits well below the 512Mi container limit rather than at it,
  # because Redis's own accounting excludes replica output buffers and part of
  # the AOF buffer while the cgroup counts all of it. This is headroom, not a
  # safety guarantee — two residual risks remain:
  # (a) `appendonly yes` means BGREWRITEAOF forks a child process; pages the
  # parent does not modify after the fork stay shared, but pages either
  # process writes afterward are duplicated, and both processes are charged
  # to the same cgroup. That copy-on-write growth is the actual consumer of
  # this headroom, and if it exceeds what is left, the outcome is a kernel
  # OOMKill of the whole pod — exactly the silent, non-client-visible failure
  # mode `noeviction` is chosen to avoid for ordinary write traffic.
  # (b) The `client-output-buffer-limit replica 64mb 32mb 60` cap (tightened
  # from the upstream default's `256mb 64mb 60`) is a deliberate trade, not a
  # free reduction: it swaps the OOMKill risk in the default for a master-side
  # forced disconnect (and replica resync retry loop) if write volume during a
  # full resync fills the buffer past 64mb before the replica drains it. The
  # application only talks to `dataspoke-redis-master`, never the replica, so
  # this trade costs standby durability during a resync window — not the
  # request path.
  commonConfiguration: |-
    # Enable ReJSON y Redisearch
    loadmodule /opt/bitnami/redis/lib/redis/modules/redisearch.so
    loadmodule /opt/bitnami/redis/lib/redis/modules/rejson.so
    # Enable AOF https://redis.io/topics/persistence#append-only-file
    appendonly yes
    # Disable RDB persistence, AOF persistence already enabled.
    save ""
    maxmemory 256mb
    maxmemory-policy noeviction
    client-output-buffer-limit replica 64mb 32mb 60
  master:
    # Bitnami redis 25.x keys: master.podAnnotations and master.pdb
    podAnnotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    pdb:
      create: true
      minAvailable: 1
    resources:
      # An explicit `resources:` map REPLACES the Bitnami `resourcesPreset`
      # wholesale rather than merging with it (charts/redis-25.3.12.tgz
      # common/templates/_resources.tpl), so `ephemeral-storage` must be
      # listed here explicitly — there is no preset underneath to fall back
      # to for it.
      requests:
        cpu: 250m
        memory: 256Mi
        ephemeral-storage: 50Mi
      limits:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 2Gi
  replica:
    replicaCount: 1
    # Bitnami redis 25.x keys: replica.podAnnotations and replica.pdb
    podAnnotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    pdb:
      create: true
      minAvailable: 1
    # Sized EQUAL to master, deliberately — a replica holds the same dataset
    # as its master, so a smaller replica (the Bitnami `nano` preset:
    # 100m/128Mi -> 150m/192Mi) OOMKills, full resyncs, and OOMKills again
    # while the master stays healthy, reading like a replica-only bug. See
    # ephemeral-storage note under master.resources.
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
        ephemeral-storage: 50Mi
      limits:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 2Gi

airflow:
  enabled: true
  useStandardNaming: true
  fullnameOverride: dataspoke-airflow
  executor: LocalExecutor

  # Airflow 3.1.8 on Python 3.13. DAGs are baked into the image:
  # build via docker-images/airflow/Dockerfile (FROM apache/airflow:3.1.8-python3.13
  # + COPY src/workflows/dags/). Prod operators: override `repository` and `tag`
  # to point at your registry's built image.
  airflowVersion: "3.1.8"
  defaultAirflowTag: "3.1.8-python3.13"
  images:
    airflow:
      repository: apache/airflow
      tag: "3.1.8-python3.13"
      pullPolicy: IfNotPresent

  # Airflow signing keys are stored in dataspoke-secrets and projected into
  # chart-compatible Secrets by install.sh (_ensure_airflow_key_secrets /
  # _ensure_airflow_fernet_secret). install.sh passes these names via --set at
  # deploy time. Pinning fernetKeySecretName here (base values.yaml, so every
  # profile inherits it) suppresses the subchart's own pre-install hook that
  # would otherwise generate and own a Fernet key of its own.
  apiSecretKeySecretName: dataspoke-airflow-api-secret-key
  jwtSecretName: dataspoke-airflow-jwt-secret
  fernetKeySecretName: dataspoke-airflow-metadata-encryption-key

  # Use existing PostgreSQL — do not deploy Airflow's bundled instance
  postgresql:
    enabled: false
  redis:
    enabled: false
  # StatsD metrics collector (Prometheus-scrapable) for Airflow observability.
  # Unsized in the chart default — a BestEffort statsd pod is the first thing
  # the kubelet evicts under node pressure, silently blinding Airflow
  # observability rather than failing loudly. Low-log container (a UDP
  # aggregator, no per-request logging), so ephemeral-storage stays small.
  statsd:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
        ephemeral-storage: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 256Mi

  # `db-migrate` is the subchart's post-install/post-upgrade hook Job
  # (templates/jobs/migrate-database-job.yaml, helm.sh/hook:
  # post-install,post-upgrade with hook-weight 1) that runs `airflow db migrate`.
  # This block is required because the chart ships no default for it — a
  # BestEffort hook pod evicted under node pressure fails the release with
  # every workload already applied and blocked on its own
  # wait-for-airflow-migrations init container, rather than failing before
  # anything was created. Sized above the app's own
  # alembic-migrate init container (api.migrate.resources) because Airflow's
  # metadata schema migration touches far more tables.
  migrateDatabaseJob:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
        ephemeral-storage: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
        ephemeral-storage: 512Mi

  # Metadata DB connection — Secret pre-created by install.sh with key `connection`.
  data:
    metadataSecretName: dataspoke-airflow-metadata-db

  # Airflow configuration overrides
  config:
    core:
      executor: LocalExecutor
      dags_folder: /opt/airflow/dags
      load_examples: "False"
      dag_dir_list_interval: "60"
      # Airflow 3.x built-in SimpleAuthManager (no FAB dependency). With
      # all_admins=True, the /auth/token endpoint accepts any credentials and
      # issues a valid JWT with admin role — matches the chart's
      # secrets.airflow.{user,password} flow without maintaining a
      # passwords file. Prod operators who want stricter auth should
      # override this to False and supply simple_auth_manager_users +
      # a pre-seeded simple_auth_manager_passwords.json file.
      auth_manager: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      simple_auth_manager_all_admins: "True"
    webserver:
      expose_config: "False"
      base_url: http://localhost:8080

  # DAGs are delivered by being baked into the custom Airflow image
  # (see docker-images/airflow/Dockerfile). No PVC, no gitSync.
  dags:
    persistence:
      enabled: false
    gitSync:
      enabled: false

  # Task logs live in emptyDir, not PVCs. Under LocalExecutor the scheduler
  # assumes the worker role, so scheduler-deployment.yaml reads
  # `workers.celery.persistence.enabled` (falling back to the deprecated
  # `workers.persistence.enabled: true`) to decide whether to render a 100Gi
  # `logs` volumeClaimTemplate; the triggerer has its own. Left at chart
  # defaults that is 200Gi of RWO storage per install. `logs.persistence` is
  # already false upstream and is not the knob that provisions these.
  # The logGroomerSidecar (enabled by default, retentionDays: 15) bounds
  # growth; sizeLimit keeps it under the pods' 4Gi ephemeral-storage request.
  # Trade-off: logs do not survive pod restart — operators wanting post-mortem
  # retention re-enable persistence in their overlay.
  workers:
    celery:
      persistence:
        enabled: false
  logs:
    emptyDirConfig:
      sizeLimit: 2Gi

  # SimpleAuthManager replaces FAB; the chart's createUserJob runs
  # `airflow users create` which was removed from core in 3.x (FAB-only).
  # With all_admins=True the login endpoint accepts any user, so we skip
  # this hook entirely.
  createUserJob:
    enabled: false

  # extraEnv is injected at install time via --set-file airflow.extraEnv=<path>
  # (see install.sh _build_airflow_extra_env_file). This injects
  # AIRFLOW_CONN_DATASPOKE_API and DATASPOKE_INTERNAL_TOKEN with the correct
  # resolved secret name for both dev and prod BYO-Secret deployments.

  # Component resources. Airflow 3.x renamed the webserver component to
  # api-server; chart 1.20 reads these from `apiServer.*` when
  # airflowVersion >= 3.0.0. The old `webserver:` key is silently ignored.
  apiServer:
    # Apache Airflow chart 1.20 PDB shape: podDisruptionBudget.enabled +
    # podDisruptionBudget.config.{minAvailable|maxUnavailable} (mutually exclusive).
    podAnnotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    podDisruptionBudget:
      enabled: true
      config:
        maxUnavailable: 0
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
        ephemeral-storage: 4Gi
      limits:
        # 500m -> 1: this pod's request already sits at half its old limit
        # under sustained UI/API traffic, leaving little burst headroom.
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 8Gi
  scheduler:
    # safeToEvict=false suppresses the chart's default safe-to-evict="true" annotation;
    # podAnnotations then sets it to "false" — one annotation, no duplicate key. The
    # maxUnavailable:0 PDB is the primary eviction guard for this single-replica component.
    safeToEvict: false
    podAnnotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    podDisruptionBudget:
      enabled: true
      config:
        maxUnavailable: 0
    # NOTE: raising resources.limits.cpu below has an undocumented derived
    # side effect — the Airflow subchart computes config.celery.sync_parallelism
    # from cpu_count of the scheduler's CPU LIMIT, so this change also moves the
    # rendered airflow.cfg (sync_parallelism 1 -> 2) and its config checksum.
    # Inert under the baseline LocalExecutor; live only if an operator switches
    # to a Celery executor.
    resources:
      # Raised to sit at or above this component's own values-dev.yaml floor:
      # the scheduler runs the same LocalExecutor over the same DAGs in both
      # profiles, so a prod default below the dev floor is backwards.
      requests:
        cpu: 500m
        memory: 1536Mi
        ephemeral-storage: 4Gi
      limits:
        cpu: 1500m
        memory: 3Gi
        ephemeral-storage: 8Gi
    logGroomerSidecar:
      resources: &logGroomerResources
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 512Mi
  triggerer:
    # safeToEvict=false suppresses the chart's default safe-to-evict="true" annotation;
    # podAnnotations then sets it to "false" — one annotation, no duplicate key. The
    # maxUnavailable:0 PDB is the primary eviction guard for this single-replica component.
    safeToEvict: false
    # Logs to emptyDir rather than the chart's default 100Gi PVC — see the
    # `workers.celery.persistence` note above.
    persistence:
      enabled: false
    podAnnotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    podDisruptionBudget:
      enabled: true
      config:
        maxUnavailable: 0
    # The tightest allocation in the chart. The triggerer holds every deferred
    # task's trigger instance in a single asyncio loop, so its memory scales
    # with deferred tasks in flight — losing it strands all of them. Its CPU
    # request rises proportionally less than its memory: on nodes where
    # allocatable CPU is the scarce dimension, a memory-request increase is
    # often free while each CPU-request increase shrinks the set of nodes the
    # pod can land on.
    resources:
      requests:
        cpu: 200m
        memory: 768Mi
        ephemeral-storage: 4Gi
      limits:
        cpu: 750m
        memory: 1536Mi
        ephemeral-storage: 8Gi
    logGroomerSidecar:
      resources: *logGroomerResources
  # dag-processor is a new standalone component in Airflow 3.x. Chart 1.20
  # leaves it unset by default — pin it for predictable scheduling.
  dagProcessor:
    # safeToEvict=false suppresses the chart's default safe-to-evict="true" annotation;
    # podAnnotations then sets it to "false" — one annotation, no duplicate key. The
    # maxUnavailable:0 PDB is the primary eviction guard for this single-replica component.
    safeToEvict: false
    podAnnotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    podDisruptionBudget:
      enabled: true
      config:
        maxUnavailable: 0
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
        ephemeral-storage: 4Gi
      limits:
        cpu: 500m
        memory: 1Gi
        ephemeral-storage: 8Gi
    logGroomerSidecar:
      resources: *logGroomerResources
  flower:
    enabled: false

  # Airflow 3.x renamed the ingress sub-key from `web` to `apiServer` (gated on
  # airflowVersion >= 3.0.0). The `web:` block is silently ignored.
  ingress:
    apiServer:
      enabled: true
      ingressClassName: "nginx"  # chart default; install.sh --sets it from DATASPOKE_KUBE_INGRESS_CLASS
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "false"
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
      hosts:
        - name: airflow.dataspoke.example.com
          tls:
            enabled: true
            secretName: airflow-tls

# ---------------------------------------------------------------------------
# Shared application configuration (injected into ConfigMap)
# ---------------------------------------------------------------------------
config:
  createConfigMap: true
  postgres:
    host: "dataspoke-postgresql"
    port: "5432"
    # user/db: the app ConfigMap is the single source of the Postgres
    # identity (the credentials Secret carries only
    # DATASPOKE_POSTGRES_PASSWORD; neither name is a secret).
    # templates/configmap.yaml fails the render if either disagrees with
    # postgresql.auth.username/database above. The role is chart-pinned, not
    # operator-choosable: it also appears as a bare literal in
    # primary.initdb.scripts above (and its copy in values-dev.yaml) and in
    # install.sh's _derive_airflow_metadata_secret, neither reachable from
    # this guard. db has no such third site — a clean, fully-guarded pair
    # with postgresql.auth.database.
    user: "dataspoke"
    db: "dataspoke"
  redis:
    host: "dataspoke-redis-master"
    port: "6379"
  airflow:
    url: "http://dataspoke-airflow-api-server:8080"
    callbackBaseUrl: "http://dataspoke-api:8002"
  corsOrigins: "http://localhost:3000"
  # Max requests per minute per rate-limit key (JWT sub, falling back to
  # client IP — see config.trustedProxyIps below for how that IP is
  # attributed). Applies to the application-wide default limiter; the
  # fail-closed auth limiter on POST /auth/token has its own fixed
  # 10/minute limit, unrelated to this value. See src/shared/settings.py
  # `rate_limit_per_minute` and src/api/middleware/rate_limit.py.
  rateLimitPerMinute: 120
  # URL the Google/OIDC callback 302-redirects to after login (the frontend
  # origin). install.sh sets this per --frontend mode in dev; prod operators set
  # it in their overlay. Default "/" works only when UI and API share a host.
  oauthPostLoginRedirect: "/"
  # Proxies uvicorn trusts to read X-Forwarded-For (see templates/configmap.yaml's
  # FORWARDED_ALLOW_IPS comment). Default trusts NO proxy beyond loopback: with
  # nothing set here, every request arriving through the ingress controller
  # shares the ingress pod's own address as its rate-limit key — a single
  # global bucket instead of one per client (issue #76), but visibly and
  # documented rather than silently, and with no forgery surface.
  #
  # Getting real per-client limits is opt-in: name your ingress controller's
  # actual pod CIDR, e.g. "127.0.0.1,10.4.0.0/14". Do NOT widen this to the
  # full RFC1918 space or "*". uvicorn applies the trust list to *every* hop
  # of X-Forwarded-For, not just the immediate peer
  # (uvicorn/middleware/proxy_headers.py `_TrustedHosts.get_trusted_client_address`).
  # Trust an over-broad range (all of RFC1918, or "*") and any caller that can
  # reach the API pod from an address in that range — an in-cluster pod, an
  # EKS VPC-CNI host, a VPN/peered-network client, or literally anyone for
  # "*" — can forge X-Forwarded-For with a fresh IP per request and get a
  # fresh rate-limit bucket every time. POST /auth/token is rate-limited
  # 10/min and there is no account-lockout fallback, so the limiter is the
  # only brute-force control; an over-broad trust list is strictly worse than
  # the single-bucket bug it's meant to fix. The API Service type is
  # configurable (api.service.type, ClusterIP by default) and reachable
  # externally only through the ingress in that default configuration — an
  # operator who changes it takes on a correspondingly larger trust surface.
  #
  # Trusting the hop is necessary but not sufficient for per-client bucketing:
  # every hop in front of the API (LB, CDN, additional proxies) must also
  # preserve the original client address in X-Forwarded-For rather than
  # overwriting it. See spec/feature/AUTH.md §Client-IP attribution for rate
  # limiting.
  #
  # Widening this also flips scope["scheme"] from the trusted hop's
  # X-Forwarded-Proto (uvicorn applies the same trust gate to both headers),
  # which changes the scheme in Google OAuth's generated redirect_uri
  # (src/api/routers/auth.py get_google_login) from http:// to https://
  # — re-verify the redirect URI registered in the Google Cloud Console
  # matches before rolling out a widened value.
  #
  # Must never be empty or "*" — templates/configmap.yaml's FORWARDED_ALLOW_IPS
  # render fails the install if either is set.
  trustedProxyIps: "127.0.0.1"

# ---------------------------------------------------------------------------
# Shared secrets — pre-created by install.sh (dev) or operator (prod)
# ---------------------------------------------------------------------------
secrets:
  # If set, the chart references this Secret instead of "dataspoke-secrets"
  # everywhere. Used for prod BYO patterns (ExternalSecrets / Vault /
  # SealedSecrets). The Secret must contain these 11 keys:
  #   DATASPOKE_POSTGRES_PASSWORD,
  #   DATASPOKE_REDIS_PASSWORD, DATASPOKE_AIRFLOW_USER, DATASPOKE_AIRFLOW_PASSWORD,
  #   DATASPOKE_INTERNAL_TOKEN, DATASPOKE_JWT_SECRET_KEY,
  #   DATASPOKE_AIRFLOW_WEBSERVER_SECRET_KEY, DATASPOKE_AIRFLOW_JWT_SECRET,
  #   DATASPOKE_AIRFLOW_FERNET_KEY,
  #   DATASPOKE_OAUTH_STATE_SECRET, DATASPOKE_GOOGLE_OAUTH_CLIENT_SECRET
  # install.sh (_check_airflow_credentials_prod) validates all 11 keys in prod.
  # Airflow signing keys are projected into chart-compatible Secrets by
  # install.sh (_ensure_airflow_key_secrets / _ensure_airflow_fernet_secret).
  # DATASPOKE_POSTGRES_USER and DATASPOKE_POSTGRES_DB are NOT in this Secret —
  # they are non-secret and live in the app ConfigMap instead (config.postgres.*
  # above), which is also where the render-time consistency guard against
  # postgresql.auth.* lives (templates/configmap.yaml). A Secret still
  # carrying either key is a prod pre-flight failure (install.sh
  # _check_airflow_credentials_prod), not silently ignored.
  existingSecret: ""
  # install.sh pre-creates the Secret; Helm does not template it.
  createSecret: false

# ---------------------------------------------------------------------------
# Network policy — cross-namespace access to DataHub
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: false
  datahubNamespace: "datahub"
