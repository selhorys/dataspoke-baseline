# DataSpoke Umbrella Chart — Production Defaults
# All components enabled with production-grade settings.

# ---------------------------------------------------------------------------
# Application subcharts
# ---------------------------------------------------------------------------
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: dataspoke/frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: dataspoke.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: dataspoke-tls
        hosts:
          - dataspoke.example.com
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

api:
  enabled: true
  replicaCount: 2
  image:
    repository: dataspoke/api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: api.dataspoke.example.com
        paths:
          - path: /api
            pathType: Prefix
    tls:
      - secretName: dataspoke-api-tls
        hosts:
          - api.dataspoke.example.com
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1024Mi

workers:
  enabled: true
  replicaCount: 2
  image:
    repository: dataspoke/workers
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 1024Mi
    limits:
      cpu: "1"
      memory: 2048Mi

# ---------------------------------------------------------------------------
# Infrastructure subcharts
# ---------------------------------------------------------------------------
postgresql:
  enabled: true
  auth:
    username: "dataspoke"
    database: "dataspoke"
    existingSecret: ""
    secretKeys:
      adminPasswordKey: "POSTGRES_PASSWORD"
      userPasswordKey: "POSTGRES_PASSWORD"
  primary:
    resources:
      requests:
        cpu: 500m
        memory: 1024Mi
      limits:
        cpu: "1"
        memory: 2048Mi
    persistence:
      size: 50Gi

redis:
  enabled: true
  auth:
    enabled: true
    existingSecret: ""
    existingSecretPasswordKey: "REDIS_PASSWORD"
  master:
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  replica:
    replicaCount: 1

qdrant:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 500m
      memory: 1024Mi
    limits:
      cpu: "1"
      memory: 2048Mi
  persistence:
    size: 50Gi

kestra:
  enabled: true
  deploymentType: STANDALONE
  image:
    tag: "v1.3.3"
  common:
    initContainers:
      - name: wait-for-postgresql
        image: busybox:1.37
        command:
          - sh
          - -c
          - |
            echo "Waiting for PostgreSQL at dataspoke-postgresql:5432..."
            until nc -z dataspoke-postgresql 5432; do
              echo "  PostgreSQL not ready — retrying in 2s"
              sleep 2
            done
            echo "PostgreSQL is reachable."
    # Mount emptyDir over /app/plugins to shadow the 175 bundled plugin JARs.
    # DataSpoke flows use only core plugins (HTTP Request, Schedule, Log)
    # which are built into the Kestra base image — no external plugins needed.
    extraVolumes:
      - name: kestra-plugins-empty
        emptyDir: {}
    extraVolumeMounts:
      - name: kestra-plugins-empty
        mountPath: /app/plugins
    jvm:
      extraOpts: "-Xms1g -Xmx3g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  deployments:
    standalone:
      workerThreads: 4
  dind:
    enabled: false
  configurations:
    application:
      datasources:
        postgres:
          url: jdbc:postgresql://dataspoke-postgresql:5432/kestra
          driverClassName: org.postgresql.Driver
          username: dataspoke
          password: ""
          maximumPoolSize: 10
          minimumIdle: 2
      kestra:
        repository:
          type: postgres
        queue:
          type: postgres
        storage:
          type: local
          local:
            basePath: /app/storage

# ---------------------------------------------------------------------------
# Shared application configuration (injected into ConfigMap)
# ---------------------------------------------------------------------------
config:
  createConfigMap: true
  datahub:
    gmsUrl: "http://datahub-datahub-gms.datahub.svc.cluster.local:8080"
    kafkaBrokers: "datahub-prerequisites-kafka.datahub.svc.cluster.local:9092"
  postgres:
    host: "dataspoke-postgresql"
    port: "5432"
    db: "dataspoke"
  redis:
    host: "dataspoke-redis-master"
    port: "6379"
  qdrant:
    host: "dataspoke-qdrant"
    httpPort: "6333"
    grpcPort: "6334"
  kestra:
    url: "http://dataspoke-kestra:8080"
    namespace: "dataspoke"
    callbackBaseUrl: "http://dataspoke-api:8000"
  llm:
    provider: "gemini"
    model: "gemini-2.0-flash"
  corsOrigins: "http://localhost:3000"

# ---------------------------------------------------------------------------
# Shared secrets (injected into Secret)
# ---------------------------------------------------------------------------
secrets:
  createSecret: true
  datahub:
    token: ""          # Personal access token (empty for local dev)
  postgres:
    user: ""
    password: ""
  redis:
    password: ""
  qdrant:
    apiKey: ""
  llm:
    apiKey: ""
  jwt:
    secretKey: ""      # Must be set in production

# ---------------------------------------------------------------------------
# Network policy — cross-namespace access to DataHub
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: false
  datahubNamespace: "datahub"
