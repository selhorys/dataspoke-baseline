# DataSpoke Umbrella Chart — Production Defaults
# All components enabled with production-grade settings.

# ---------------------------------------------------------------------------
# Application subcharts
# ---------------------------------------------------------------------------
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: dataspoke/frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: dataspoke.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: dataspoke-tls
        hosts:
          - dataspoke.example.com
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

api:
  enabled: true
  subchart:
    enabled: false    # Set true only to use the legacy subcharts/api deployment
  replicaCount: 2
  image:
    repository: dataspoke/api
    tag: latest
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  testMode: false
  service:
    type: ClusterIP
    port: 8002
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: api.dataspoke.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: dataspoke-api-tls
        hosts:
          - api.dataspoke.example.com
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1024Mi

workers:
  enabled: true
  replicaCount: 2
  image:
    repository: dataspoke/workers
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 1024Mi
    limits:
      cpu: "1"
      memory: 2048Mi

# ---------------------------------------------------------------------------
# Infrastructure subcharts
# ---------------------------------------------------------------------------
postgresql:
  enabled: true
  auth:
    username: "dataspoke"
    database: "dataspoke"
    existingSecret: ""
    secretKeys:
      adminPasswordKey: "POSTGRES_PASSWORD"
      userPasswordKey: "POSTGRES_PASSWORD"
  primary:
    resources:
      requests:
        cpu: 500m
        memory: 1024Mi
      limits:
        cpu: "1"
        memory: 2048Mi
    persistence:
      size: 50Gi

redis:
  enabled: true
  auth:
    enabled: true
    existingSecret: ""
    existingSecretPasswordKey: "REDIS_PASSWORD"
  master:
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  replica:
    replicaCount: 1

qdrant:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 500m
      memory: 1024Mi
    limits:
      cpu: "1"
      memory: 2048Mi
  persistence:
    size: 50Gi

airflow:
  enabled: true
  executor: LocalExecutor

  # Use existing PostgreSQL — do not deploy Airflow's bundled instance
  postgresql:
    enabled: false
  redis:
    enabled: false

  # Metadata DB connection to existing dataspoke PostgreSQL
  data:
    metadataConnection:
      user: dataspoke
      pass: ""
      protocol: postgresql
      host: dataspoke-postgresql
      port: 5432
      db: airflow
      sslmode: disable

  # Airflow configuration overrides
  config:
    core:
      executor: LocalExecutor
      dags_folder: /opt/airflow/dags
      load_examples: "False"
      dag_dir_list_interval: "60"
    api:
      auth_backends: airflow.api.auth.backend.basic_auth
    webserver:
      expose_config: "False"
      base_url: http://localhost:8080

  # DAGs from ConfigMap
  dags:
    persistence:
      enabled: false
    gitSync:
      enabled: false

  # Mount DAGs from our ConfigMap
  extraVolumes:
    - name: dataspoke-dags
      configMap:
        name: dataspoke-airflow-dags
  extraVolumeMounts:
    - name: dataspoke-dags
      mountPath: /opt/airflow/dags
      readOnly: true

  # Pre-configure the dataspoke_api HTTP connection
  extraEnv: |
    - name: AIRFLOW_CONN_DATASPOKE_API
      value: "http://dataspoke-api:8002"

  # Component resources
  webserver:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
  scheduler:
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
  triggerer:
    resources:
      requests:
        cpu: 125m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 512Mi
  workers:
    enabled: false
  flower:
    enabled: false

  ingress:
    web:
      enabled: true
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "false"
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
      hosts:
        - name: airflow.dataspoke.example.com
          tls:
            enabled: true
            secretName: airflow-tls

# ---------------------------------------------------------------------------
# Shared application configuration (injected into ConfigMap)
# ---------------------------------------------------------------------------
config:
  createConfigMap: true
  datahub:
    gmsUrl: "http://datahub-datahub-gms.datahub.svc.cluster.local:8080"
    kafkaBrokers: "datahub-prerequisites-kafka.datahub.svc.cluster.local:9092"
  postgres:
    host: "dataspoke-postgresql"
    port: "5432"
    db: "dataspoke"
  redis:
    host: "dataspoke-redis-master"
    port: "6379"
  qdrant:
    host: "dataspoke-qdrant"
    httpPort: "6333"
    grpcPort: "6334"
  airflow:
    url: "http://dataspoke-airflow-webserver:8080"
    callbackBaseUrl: "http://dataspoke-api:8002"
  llm:
    provider: "gemini"
    model: "gemini-2.0-flash"
  corsOrigins: "http://localhost:3000"

# ---------------------------------------------------------------------------
# Shared secrets (injected into Secret)
# ---------------------------------------------------------------------------
secrets:
  createSecret: true
  datahub:
    token: ""          # Personal access token (empty for local dev)
  postgres:
    user: ""
    password: ""
  redis:
    password: ""
  qdrant:
    apiKey: ""
  airflow:
    user: ""
    password: ""
  llm:
    apiKey: ""
  jwt:
    secretKey: ""      # Must be set in production

# ---------------------------------------------------------------------------
# Network policy — cross-namespace access to DataHub
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: false
  datahubNamespace: "datahub"
