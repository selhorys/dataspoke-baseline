apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "event-consumer.fullname" . }}
  labels:
    {{- include "event-consumer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "event-consumer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "event-consumer.selectorLabels" . | nindent 8 }}
      {{/*
        envFrom env vars are evaluated only at container start; a ConfigMap or
        Secret content change does not restart consumers. This subchart has no
        ConfigMap/Secret template of its own — it consumes the umbrella
        chart's parent-owned `dataspoke-app-config` ConfigMap and
        `dataspoke-secrets` Secret, which it cannot `include`. These
        `lookup`-based checksums force a rolling restart whenever the live
        ConfigMap/Secret content changes. `lookup` returns empty during
        `helm template` / dry-run (no cluster), which is safe.
      */}}
      annotations:
        checksum/config: {{ (lookup "v1" "ConfigMap" .Release.Namespace "dataspoke-app-config").data | default dict | toJson | sha256sum }}
        checksum/secret: {{ (lookup "v1" "Secret" .Release.Namespace "dataspoke-secrets").data | default dict | toJson | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "event-consumer.serviceAccountName" . }}
      {{- if .Values.waitForDeps.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.waitForDeps.image }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL at ${DATASPOKE_POSTGRES_HOST}:${DATASPOKE_POSTGRES_PORT:-5432}..."
              until nc -z "${DATASPOKE_POSTGRES_HOST}" "${DATASPOKE_POSTGRES_PORT:-5432}"; do
                echo "  postgres not ready — retrying in 3s"; sleep 3
              done
              echo "PostgreSQL is reachable; proceeding."
          envFrom:
            - configMapRef:
                name: dataspoke-app-config
                optional: true
            - secretRef:
                name: {{ .Values.existingSecretName | default "dataspoke-secrets" }}
                optional: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: event-consumer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{/*
            The image is the API image (docker-images/api/Dockerfile), which
            ends in a CMD rather than an ENTRYPOINT, so this command replaces
            the uvicorn server outright and the same artifact serves both
            workloads. Kafka brokers and security settings are not passed here —
            the consumer reads them from peripheral_config and re-reads them
            while polling, so a connection change needs no redeploy.
          */}}
          command: ["python", "-m", "src.shared.datahub.consumer"]
          envFrom:
            - configMapRef:
                name: dataspoke-app-config
                optional: true
            - secretRef:
                name: {{ .Values.existingSecretName | default "dataspoke-secrets" }}
                optional: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
