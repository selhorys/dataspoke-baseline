apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "event-consumer.fullname" . }}
  labels:
    {{- include "event-consumer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "event-consumer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "event-consumer.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: event-consumer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
                optional: true
            - secretRef:
                name: {{ .Release.Name }}-secrets
                optional: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
