{{- if .Values.serviceAccount.create }}
{{/*
  ServiceAccount for the event-consumer pod. It carries two responsibilities:

  1. Secret access — the Role/RoleBinding in secret-reader-rbac.yaml let the
     consumer read the Kafka SASL credential from dataspoke-datahub-secret at
     connect time.
  2. Cloud identity — serviceAccount.annotations is where workload identity is
     attached. With kafka_sasl_mechanism = AWS_MSK_IAM the consumer authenticates
     as an IAM role rather than with a typed credential, so the operator sets
     eks.amazonaws.com/role-arn here; the MSK signer in the API image resolves
     the projected role at runtime. Selecting the mechanism is a DB-plane change
     via /api/v1/admin/peripherals/datahub, but the identity it authenticates
     with can only be granted at install time, here.

  See spec/feature/HELM_CHART.md §Event-consumer identity and RBAC.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "event-consumer.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "event-consumer.labels" . | nindent 4 }}
    app.kubernetes.io/component: event-consumer
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
