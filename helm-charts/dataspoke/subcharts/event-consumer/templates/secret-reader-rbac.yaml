{{- if .Values.serviceAccount.create }}
{{/*
  Secret-reader Role for the event consumer, in its own release namespace.
  Single-namespace policy: no cross-namespace Roles or RoleBindings are rendered.

  This Role is deliberately much narrower than the API's (see the umbrella
  chart's api-secret-reader-rbac.yaml):

  - verbs are `get` alone. The consumer only ever reads; it never enumerates,
    creates, or rotates a Secret. Writing the Kafka SASL password belongs to the
    API's PATCH /api/v1/admin/peripherals/datahub handler, which has its own
    Role for it.
  - resourceNames pins access to the single Secret the consumer needs. The API's
    Role must stay namespace-wide because its source-credential resolver
    enumerates a whole dataspoke-source-cred-* prefix it cannot name in advance;
    the consumer has exactly one Secret and knows its name at chart-render time,
    so the tighter form costs nothing.

  Note that `get` with resourceNames does not permit `list` — a list request
  returns every Secret in the namespace and so cannot be filtered by name. That
  is the intended limit: the consumer resolves one key by name and nothing else.

  Rendered only when serviceAccount.create is true. An operator supplying their
  own ServiceAccount owns the equivalent grant themselves.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "event-consumer.fullname" . }}-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "event-consumer.labels" . | nindent 4 }}
    app.kubernetes.io/component: event-consumer
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ include "event-consumer.datahubSecretName" . }}"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "event-consumer.fullname" . }}-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "event-consumer.labels" . | nindent 4 }}
    app.kubernetes.io/component: event-consumer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "event-consumer.fullname" . }}-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "event-consumer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
