apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}-config
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
data:
  # Runtime config consumed server-side by Next.js (no NEXT_PUBLIC_ prefix —
  # values are not baked at build time; the server injects them into the page).
  DATASPOKE_API_BASE_URL: {{ .Values.config.apiBaseUrl | quote }}
  DATASPOKE_DATAHUB_URL: {{ .Values.config.datahubUrl | quote }}
