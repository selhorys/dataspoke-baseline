replicaCount: 1

# Annotations merged onto every pod template — used to set the
# cluster-autoscaler safe-to-evict guard on this stateless workload.
podAnnotations:
  cluster-autoscaler.kubernetes.io/safe-to-evict: "false"

# PodDisruptionBudget — keeps minAvailable pods running during voluntary
# disruptions (node drains, Karpenter scale-in, cluster upgrades).
podDisruptionBudget:
  enabled: true
  minAvailable: 1

image:
  repository: dataspoke/frontend
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources: {}

# Scheduling knobs — {{- with }}-guarded in templates/deployment.yaml, so an
# unset key renders nothing. topologySpreadConstraints is deliberately left
# UNSET (not `[]`) rather than defaulted here: this subchart's own selector
# (frontend.selectorLabels = name + app.kubernetes.io/instance:
# {{ .Release.Name }}) needs .Release.Name, which a values.yaml default
# cannot reach, so the template supplies the default spread itself via
# `{{- with .Values.topologySpreadConstraints }}…{{- else }}…{{- end }}` and
# an operator overrides it by setting their own non-empty list — an explicit
# `[]` is treated as unset by `{{- with }}` and falls through to the shipped
# default, so there is no way to opt out of the spread entirely (by design:
# ScheduleAnyway is soft and never leaves a pod Pending). The umbrella chart
# leaves this key unset too, for the same reason — see
# spec/feature/HELM_CHART.md §Scheduling and spread.
nodeSelector: {}
tolerations: []
affinity: {}

# Runtime config injected into the Next.js server via the frontend ConfigMap.
# Values are consumed server-side (no NEXT_PUBLIC_ prefix; not baked at build time).
# Override via umbrella values.yaml (frontend.config.*) or --set at deploy time.
# DataHub and Langfuse deep links are not configured here — the DataSpoke API
# resolves them at request time from the DB `peripheral_config` table
# (GET /spoke/common/peripheral-links), seeded via
# PATCH /api/v1/admin/peripherals/{datahub,langfuse}.
config:
  # URL of the DataSpoke API. The Next.js server uses this to call the API on
  # behalf of SSR requests. Set to the API ingress host for the target environment.
  apiBaseUrl: ""
  # URL of the Airflow UI. Used for the header infra link (hidden when empty).
  airflowUrl: ""
