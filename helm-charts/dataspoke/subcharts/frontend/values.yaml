replicaCount: 1

image:
  repository: dataspoke/frontend
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources: {}

# Name of the pre-created K8s Secret containing runtime credentials.
# Set by the umbrella chart via the parent's secrets.existingSecret value.
# Defaults to "<release-name>-secrets" when empty (install.sh passes the
# resolved name via --set frontend.existingSecretName=<name>).
existingSecretName: ""
