# DataSpoke Umbrella Chart — Dev Overlay
# Infrastructure only. Application subcharts disabled (run on the host).
# Target cluster: GKE Autopilot (gke-dev-env-01)
# Used by: dev_env/dataspoke-infra/install.sh

# ---------------------------------------------------------------------------
# Application components: disabled (developers run them on the host)
# ---------------------------------------------------------------------------
frontend:
  enabled: false
api:
  enabled: false
workers:
  enabled: false

# ---------------------------------------------------------------------------
# Infrastructure components: enabled with reduced resources
# ---------------------------------------------------------------------------
postgresql:
  enabled: true
  auth:
    # username/database: passed via --set from .env
    secretKeys:
      adminPasswordKey: "POSTGRES_PASSWORD"
      userPasswordKey: "POSTGRES_PASSWORD"
  primary:
    resources:
      limits:
        memory: 1Gi
        cpu: 1000m
      requests:
        memory: 512Mi
        cpu: 250m
    persistence:
      size: 10Gi
    initdb:
      scripts:
        create-kestra-db.sql: |
          CREATE DATABASE kestra;

redis:
  enabled: true
  auth:
    existingSecretPasswordKey: "REDIS_PASSWORD"
  master:
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 250m
  replica:
    replicaCount: 0

qdrant:
  enabled: true
  resources:
    limits:
      memory: 2Gi
      cpu: 1000m
    requests:
      memory: 1Gi
      cpu: 250m
  persistence:
    size: 10Gi

kestra:
  enabled: true
  deploymentType: STANDALONE
  image:
    tag: "v1.3.3"
  common:
    initContainers:
      - name: wait-for-postgresql
        image: busybox:1.37
        command:
          - sh
          - -c
          - |
            echo "Waiting for PostgreSQL at dataspoke-postgresql:5432..."
            until nc -z dataspoke-postgresql 5432; do
              echo "  PostgreSQL not ready — retrying in 2s"
              sleep 2
            done
            echo "PostgreSQL is reachable."
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
    # Mount emptyDir over /app/plugins to shadow the 175 bundled plugin JARs.
    # DataSpoke flows use only core plugins (HTTP Request, Schedule, Log)
    # which are built into the Kestra base image — no external plugins needed.
    extraVolumes:
      - name: kestra-plugins-empty
        emptyDir: {}
    extraVolumeMounts:
      - name: kestra-plugins-empty
        mountPath: /app/plugins
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    jvm:
      extraOpts: "-Xms1g -Xmx3g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    startupProbe:
      httpGet:
        path: /health
        port: management
      initialDelaySeconds: 5
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 150
    livenessProbe:
      httpGet:
        path: /health/liveness
        port: management
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 6
    readinessProbe:
      httpGet:
        path: /health/readiness
        port: management
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 6
  deployments:
    standalone:
      workerThreads: 4
  dind:
    enabled: false
  configurations:
    application:
      datasources:
        postgres:
          url: jdbc:postgresql://dataspoke-postgresql:5432/kestra
          driverClassName: org.postgresql.Driver
          # username/password: passed via --set from .env
          maximumPoolSize: 10
          minimumIdle: 2
      kestra:
        repository:
          type: postgres
        queue:
          type: postgres
        storage:
          type: local
          local:
            basePath: /app/storage
        tutorial-flows:
          enabled: false
        anonymous-usage-report:
          enabled: false
        server:
          basic-auth:
            username: dataspoke@dataspoke.local
            password: DataSpoke1
          liveness:
            interval: 30s
            heartbeatInterval: 10s
        jdbc:
          queues:
            min-poll-interval: 100ms
            max-poll-interval: 1s
            poll-switch-interval: 60s
          cleaner:
            initial-delay: 5m
            fixed-delay: 30m
            retention: 1h

# ---------------------------------------------------------------------------
# ConfigMap/Secret: not created in dev (app reads env vars directly)
# ---------------------------------------------------------------------------
config:
  createConfigMap: false
secrets:
  createSecret: false
