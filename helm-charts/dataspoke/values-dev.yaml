# DataSpoke Umbrella Chart — Dev Overlay
# Infrastructure only. Application subcharts disabled (run on the host).
# Used by: dev_env/dataspoke-infra/install.sh

# ---------------------------------------------------------------------------
# Application components: frontend/workers run on the host; API runs in-cluster
# so Kestra can reach it via http://dataspoke-api:8000.
# ---------------------------------------------------------------------------
frontend:
  enabled: false
api:
  enabled: true
  replicaCount: 1
  image:
    # repository + tag passed via --set from .env (DATASPOKE_DEV_IMAGE_REGISTRY)
    pullPolicy: Always
  testMode: true
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    hosts:
      - host: "app.dev.dataspoke.example.com"
        paths:
          - path: /
            pathType: Prefix
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1024Mi
workers:
  enabled: false

# ---------------------------------------------------------------------------
# Infrastructure components: enabled with reduced resources
# ---------------------------------------------------------------------------
postgresql:
  enabled: true
  auth:
    # username/database: passed via --set from .env
    secretKeys:
      adminPasswordKey: "POSTGRES_PASSWORD"
      userPasswordKey: "POSTGRES_PASSWORD"
  primary:
    resources:
      limits:
        memory: 1Gi
        cpu: 1000m
      requests:
        memory: 512Mi
        cpu: 250m
    persistence:
      size: 10Gi
    initdb:
      scripts:
        create-kestra-db.sql: |
          CREATE DATABASE kestra;

redis:
  enabled: true
  auth:
    existingSecretPasswordKey: "REDIS_PASSWORD"
  master:
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 250m
  replica:
    replicaCount: 0

qdrant:
  enabled: true
  resources:
    limits:
      memory: 2Gi
      cpu: 1000m
    requests:
      memory: 1Gi
      cpu: 250m
  persistence:
    size: 10Gi

kestra:
  enabled: true
  deploymentType: STANDALONE
  image:
    tag: "v1.3.3"
  common:
    initContainers:
      - name: wait-for-postgresql
        image: busybox:1.37
        command:
          - sh
          - -c
          - |
            echo "Waiting for PostgreSQL at dataspoke-postgresql:5432..."
            until nc -z dataspoke-postgresql 5432; do
              echo "  PostgreSQL not ready — retrying in 2s"
              sleep 2
            done
            echo "PostgreSQL is reachable."
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
    # Mount emptyDir over /app/plugins to shadow the 175 bundled plugin JARs.
    # DataSpoke flows use only core plugins (HTTP Request, Schedule, Log)
    # which are built into the Kestra base image — no external plugins needed.
    extraVolumes:
      - name: kestra-plugins-empty
        emptyDir: {}
    extraVolumeMounts:
      - name: kestra-plugins-empty
        mountPath: /app/plugins
    resources:
      requests:
        cpu: "4"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 8Gi
    jvm:
      extraOpts: "-Xms2g -Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    startupProbe:
      httpGet:
        path: /health
        port: management
      initialDelaySeconds: 5
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 150
    livenessProbe:
      httpGet:
        path: /health/liveness
        port: management
      periodSeconds: 10
      timeoutSeconds: 15
      failureThreshold: 30
    readinessProbe:
      httpGet:
        path: /health/readiness
        port: management
      periodSeconds: 10
      timeoutSeconds: 15
      failureThreshold: 30
  deployments:
    standalone:
      workerThreads: 4
  dind:
    enabled: false
  configurations:
    application:
      datasources:
        postgres:
          url: jdbc:postgresql://dataspoke-postgresql:5432/kestra
          driverClassName: org.postgresql.Driver
          # username/password: passed via --set from .env
          maximumPoolSize: 10
          minimumIdle: 2
      kestra:
        repository:
          type: postgres
        queue:
          type: postgres
        storage:
          type: local
          local:
            basePath: /app/storage
        tutorial-flows:
          enabled: false
        anonymous-usage-report:
          enabled: false
        server:
          basic-auth:
            username: dataspoke@dataspoke.local
            password: DataSpoke1
          liveness:
            interval: 30s
            heartbeatInterval: 10s
        jdbc:
          queues:
            min-poll-interval: 2s
            max-poll-interval: 5s
            poll-switch-interval: 60s
          cleaner:
            initial-delay: 5m
            fixed-delay: 30m
            retention: 1h
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "10240m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    hosts:
      - host: "kestra.dev.dataspoke.example.com"
        paths:
          - path: /
            pathType: Prefix

# ---------------------------------------------------------------------------
# ConfigMap/Secret: created in dev for in-cluster API deployment
# ---------------------------------------------------------------------------
config:
  createConfigMap: true
secrets:
  createSecret: true
