# DataSpoke Umbrella Chart — Dev Overlay
# Infrastructure only. Application subcharts disabled (run on the host).
# Used by: dev_env/dataspoke-infra/install.sh

# ---------------------------------------------------------------------------
# Application components: disabled (developers run them on the host)
# ---------------------------------------------------------------------------
frontend:
  enabled: false
api:
  enabled: false
workers:
  enabled: false

# ---------------------------------------------------------------------------
# Infrastructure components: enabled with reduced resources
# ---------------------------------------------------------------------------
postgresql:
  enabled: true
  auth:
    # username/database: passed via --set from .env
    secretKeys:
      adminPasswordKey: "POSTGRES_PASSWORD"
      userPasswordKey: "POSTGRES_PASSWORD"
  primary:
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 100m
    persistence:
      size: 10Gi
    initdb:
      scripts:
        create-kestra-db.sql: |
          CREATE DATABASE kestra;

redis:
  enabled: true
  auth:
    existingSecretPasswordKey: "REDIS_PASSWORD"
  master:
    resources:
      limits:
        memory: 256Mi
        cpu: 250m
      requests:
        memory: 128Mi
        cpu: 50m
  replica:
    replicaCount: 0

qdrant:
  enabled: true
  resources:
    limits:
      memory: 1024Mi
      cpu: 500m
    requests:
      memory: 512Mi
      cpu: 100m
  persistence:
    size: 10Gi

kestra:
  enabled: true
  deploymentType: STANDALONE
  image:
    tag: "v1.3.3"
  common:
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
      limits:
        cpu: "1"
        memory: 2560Mi
    jvm:
      extraOpts: "-Xms512m -Xmx2048m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
  deployments:
    standalone:
      workerThreads: 4
  dind:
    enabled: false
  configurations:
    application:
      datasources:
        postgres:
          url: jdbc:postgresql://dataspoke-postgresql:5432/kestra
          driverClassName: org.postgresql.Driver
          # username/password: passed via --set from .env
      kestra:
        repository:
          type: postgres
        queue:
          type: postgres
        storage:
          type: local
          local:
            basePath: /app/storage
        tutorial-flows:
          enabled: false
        anonymous-usage-report:
          enabled: false
        server:
          basic-auth:
            username: dataspoke@dataspoke.local
            password: DataSpoke1
          liveness:
            interval: 30s
            heartbeatInterval: 10s
        jdbc:
          queues:
            min-poll-interval: 100ms
            max-poll-interval: 1000ms
            poll-switch-interval: 300s
          cleaner:
            initial-delay: 2h
            fixed-delay: 4h
            retention: 1d

# ---------------------------------------------------------------------------
# ConfigMap/Secret: not created in dev (app reads env vars directly)
# ---------------------------------------------------------------------------
config:
  createConfigMap: false
secrets:
  createSecret: false
