# DataSpoke Umbrella Chart — Dev Overlay
# Infrastructure only. Application subcharts disabled (run on the host).
# Used by: helm-charts/bin/install.sh --profile dev

# ---------------------------------------------------------------------------
# Global — Bitnami subchart compatibility (see values.yaml for rationale)
# ---------------------------------------------------------------------------
global:
  security:
    allowInsecureImages: true

# ---------------------------------------------------------------------------
# Application components: frontend runs on the host; event-consumer is disabled
# in dev (baseline UC1–UC5 are schedule-driven, not event-driven). API runs
# in-cluster so Airflow can reach it via http://dataspoke-api:8002.
# ---------------------------------------------------------------------------
frontend:
  enabled: false
api:
  enabled: true
  replicaCount: 1
  image:
    # repository + tag passed via --set from .env (DATASPOKE_KUBE_IMAGE_REGISTRY)
    pullPolicy: Always
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    hosts:
      - host: "api.dev.dataspoke.example.com"
        paths:
          - path: /
            pathType: Prefix
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 2Gi
    limits:
      cpu: "1"
      memory: 1024Mi
      ephemeral-storage: 4Gi
event-consumer:
  enabled: false

# ---------------------------------------------------------------------------
# Auth — override prod defaults for dev (HTTP)
# ---------------------------------------------------------------------------
# cookieSecure: false — dev runs over HTTP; Secure cookie flag would block
#   the refresh-token cookie from being set on http:// origins.
# googleClientId: "" — overridden at install time via
#   --set-string auth.googleClientId=${DATASPOKE_DEV_GOOGLE_OAUTH_CLIENT_ID}
#   from install.sh. Leaving it empty here means OAuth is disabled unless
#   the operator sets DATASPOKE_DEV_GOOGLE_OAUTH_CLIENT_ID in .env.
auth:
  cookieSecure: false
  googleClientId: ""

# ---------------------------------------------------------------------------
# Infrastructure components: enabled with reduced resources
# ---------------------------------------------------------------------------
postgresql:
  enabled: true
  image:
    # registry + repository + tag passed via --set-string from install.sh.
    # pullPolicy: Always ensures the :dev tag is always pulled after rebuild.
    pullPolicy: Always
  auth:
    existingSecret: "dataspoke-secrets"
    secretKeys:
      adminPasswordKey: "DATASPOKE_POSTGRES_PASSWORD"
      userPasswordKey: "DATASPOKE_POSTGRES_PASSWORD"
      replicationPasswordKey: "DATASPOKE_POSTGRES_PASSWORD"
  primary:
    resources:
      limits:
        memory: 4096Mi
        cpu: "2"
        ephemeral-storage: 4Gi
      requests:
        memory: 2048Mi
        cpu: "1"
        ephemeral-storage: 2Gi
    persistence:
      size: 10Gi
    # Apache AGE requires shared_preload_libraries so its C hooks load at
    # server startup; without it CREATE EXTENSION succeeds but graph functions
    # fail at runtime with "extension 'age' must be loaded via shared_preload_libraries".
    # Bitnami PG 18.x key: primary.extendedConfiguration (renders as override.conf).
    extendedConfiguration: |
      shared_preload_libraries = 'age'
    initdb:
      scripts:
        # Extensions are created in the `dataspoke` DB (the default initdb
        # connection). AGE and pgvector workloads must connect to `dataspoke`.
        01-extensions.sql: |
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE EXTENSION IF NOT EXISTS age;
          -- Allow the dataspoke application role to call AGE graph functions.
          GRANT USAGE ON SCHEMA ag_catalog TO dataspoke;
          GRANT SELECT ON ALL TABLES IN SCHEMA ag_catalog TO dataspoke;
        create-airflow-db.sql: |
          CREATE DATABASE airflow;

redis:
  enabled: true
  # Bitnami moved unversioned tags behind a paywall (August 2025). Use the
  # `bitnamilegacy/*` namespace to keep pulling a free, chart-compatible image.
  image:
    repository: bitnamilegacy/redis
    tag: "8.2.1-debian-12-r0"
  auth:
    existingSecret: "dataspoke-secrets"
    existingSecretPasswordKey: "DATASPOKE_REDIS_PASSWORD"
  master:
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 250m
  replica:
    replicaCount: 0

airflow:
  enabled: true
  useStandardNaming: true
  fullnameOverride: dataspoke-airflow
  executor: LocalExecutor
  # Airflow signing keys come from dataspoke-secrets projected by install.sh.
  # apiSecretKeySecretName and jwtSecretName are passed via --set at deploy time.

  # Airflow 3.1.8 on Python 3.13. DAGs are baked into the image; the
  # repository + tag are overridden via --set at install time
  # (helm-charts/bin/install.sh) to point at the dev Artifact
  # Registry image built by helm-charts/bin/build-image.sh airflow.
  airflowVersion: "3.1.8"
  defaultAirflowTag: "3.1.8-python3.13"
  images:
    airflow:
      repository: apache/airflow
      tag: "3.1.8-python3.13"
      pullPolicy: Always

  # Use existing PostgreSQL — do not deploy Airflow's bundled instance
  postgresql:
    enabled: false
  redis:
    enabled: false
  # StatsD metrics collector disabled in dev — no Prometheus scraping here.
  # Enabled in prod (see values.yaml) for Airflow observability.
  statsd:
    enabled: false

  # Metadata DB connection — Secret pre-created by install.sh with key `connection`.
  data:
    metadataSecretName: dataspoke-airflow-metadata-db

  # Airflow configuration overrides
  config:
    core:
      executor: LocalExecutor
      dags_folder: /opt/airflow/dags
      load_examples: "False"
      dag_dir_list_interval: "60"
      # Airflow 3.x built-in SimpleAuthManager (no FAB). all_admins=True makes
      # /auth/token accept any credentials and issue a JWT with admin role —
      # fine for dev.
      auth_manager: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      simple_auth_manager_all_admins: "True"
    webserver:
      expose_config: "False"
      base_url: http://localhost:8080

  # DAGs baked into the custom Airflow image — no PVC / gitSync in dev.
  dags:
    persistence:
      enabled: false
    gitSync:
      enabled: false

  # Skip the chart's createUserJob — 3.x removed `airflow users create` and
  # SimpleAuthManager (all_admins=True) handles login without it.
  createUserJob:
    enabled: false

  # extraEnv is injected at install time via --set-file airflow.extraEnv=<path>
  # (see install.sh _build_airflow_extra_env_file).

  # Component resources (dev minimums). Airflow 3.x api-server is FastAPI
  # (uvicorn, 1 worker) — the 500m-CPU Gunicorn-monitor-SIGTERM class of
  # bugs from 2.x does not apply. CPU requests are sized to observed
  # steady-state load; limits stay generous for burst.
  apiServer:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
        ephemeral-storage: 4Gi
      limits:
        cpu: "2"
        memory: 1Gi
        ephemeral-storage: 8Gi
  # The scheduler runs tasks in-process (LocalExecutor), so memory is sized for
  # concurrent on-demand DAG runs (metric / ingestion / metagen) plus a heavy
  # reset-seed ingest, not just steady-state scheduling.
  scheduler:
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
        ephemeral-storage: 4Gi
      limits:
        cpu: 500m
        memory: 2Gi
        ephemeral-storage: 8Gi
    logGroomerSidecar:
      resources: &logGroomerResources
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 512Mi
  triggerer:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
        ephemeral-storage: 4Gi
      limits:
        cpu: 500m
        memory: 1Gi
        ephemeral-storage: 8Gi
    logGroomerSidecar:
      resources: *logGroomerResources
  # dag-processor is a new standalone component in Airflow 3.x. The chart
  # leaves it unset by default — pin it for predictable Autopilot scheduling.
  dagProcessor:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
        ephemeral-storage: 4Gi
      limits:
        cpu: 500m
        memory: 1Gi
        ephemeral-storage: 8Gi
    logGroomerSidecar:
      resources: *logGroomerResources
  flower:
    enabled: false

  # Airflow 3.x renamed the ingress sub-key from `web` to `apiServer` (gated on
  # airflowVersion >= 3.0.0). The `web:` block is silently ignored.
  ingress:
    apiServer:
      enabled: true
      ingressClassName: "nginx"
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "false"
      hosts:
        - name: "airflow.dev.dataspoke.example.com"
          tls:
            enabled: false

# ---------------------------------------------------------------------------
# ConfigMap: created in dev for in-cluster API deployment
# ---------------------------------------------------------------------------
config:
  createConfigMap: true
