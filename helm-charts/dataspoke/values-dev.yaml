# DataSpoke Umbrella Chart — Dev Overlay
# Infrastructure only. Application subcharts disabled (run on the host).
# Used by: dev_env/dataspoke-infra/install.sh

# ---------------------------------------------------------------------------
# Application components: frontend/workers run on the host; API runs in-cluster
# so Airflow can reach it via http://dataspoke-api:8000.
# ---------------------------------------------------------------------------
frontend:
  enabled: false
api:
  enabled: true
  replicaCount: 1
  image:
    # repository + tag passed via --set from .env (DATASPOKE_DEV_IMAGE_REGISTRY)
    pullPolicy: Always
  testMode: true
  enableStubAuth: true
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    hosts:
      - host: "app.dev.dataspoke.example.com"
        paths:
          - path: /
            pathType: Prefix
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1024Mi
workers:
  enabled: false

# ---------------------------------------------------------------------------
# Infrastructure components: enabled with reduced resources
# ---------------------------------------------------------------------------
postgresql:
  enabled: true
  auth:
    # username/database: passed via --set from .env
    secretKeys:
      adminPasswordKey: "POSTGRES_PASSWORD"
      userPasswordKey: "POSTGRES_PASSWORD"
  primary:
    resources:
      limits:
        memory: 1Gi
        cpu: 1000m
      requests:
        memory: 512Mi
        cpu: 250m
    persistence:
      size: 10Gi
    initdb:
      scripts:
        create-airflow-db.sql: |
          CREATE DATABASE airflow;

redis:
  enabled: true
  auth:
    existingSecretPasswordKey: "REDIS_PASSWORD"
  master:
    resources:
      limits:
        memory: 512Mi
        cpu: 500m
      requests:
        memory: 256Mi
        cpu: 250m
  replica:
    replicaCount: 0

qdrant:
  enabled: true
  resources:
    limits:
      memory: 2Gi
      cpu: 1000m
    requests:
      memory: 1Gi
      cpu: 250m
  persistence:
    size: 10Gi

airflow:
  enabled: true
  executor: LocalExecutor

  # Use existing PostgreSQL — do not deploy Airflow's bundled instance
  postgresql:
    enabled: false
  redis:
    enabled: false

  # Metadata DB connection to existing dataspoke PostgreSQL
  data:
    metadataConnection:
      user: dataspoke
      pass: ""
      protocol: postgresql
      host: dataspoke-postgresql
      port: 5432
      db: airflow
      sslmode: disable

  # Airflow configuration overrides
  config:
    core:
      executor: LocalExecutor
      dags_folder: /opt/airflow/dags
      load_examples: "False"
      dag_dir_list_interval: "60"
    api:
      auth_backends: airflow.api.auth.backend.basic_auth
    webserver:
      expose_config: "False"
      base_url: http://localhost:8080

  # DAGs from ConfigMap
  dags:
    persistence:
      enabled: false
    gitSync:
      enabled: false

  # Mount DAGs from our ConfigMap
  extraVolumes:
    - name: dataspoke-dags
      configMap:
        name: dataspoke-airflow-dags
  extraVolumeMounts:
    - name: dataspoke-dags
      mountPath: /opt/airflow/dags
      readOnly: true

  # Pre-configure the dataspoke_api HTTP connection and internal auth token
  extraEnv: |
    - name: AIRFLOW_CONN_DATASPOKE_API
      value: "http://dataspoke-api:8002"
    - name: DATASPOKE_INTERNAL_TOKEN
      valueFrom:
        secretKeyRef:
          name: dataspoke-internal-auth
          key: token

  # Component resources (dev minimums)
  webserver:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 512Mi
  scheduler:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
  triggerer:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 125m
        memory: 256Mi
  workers:
    enabled: false
  flower:
    enabled: false

  ingress:
    web:
      enabled: true
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "false"
      hosts:
        - name: "airflow.dev.dataspoke.example.com"
          tls:
            enabled: false

# ---------------------------------------------------------------------------
# ConfigMap/Secret: created in dev for in-cluster API deployment
# ---------------------------------------------------------------------------
config:
  createConfigMap: true
secrets:
  createSecret: true
  jwt:
    secretKey: "changeme-dev-secret-do-not-use-in-prod"
