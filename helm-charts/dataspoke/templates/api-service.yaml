{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: dataspoke-api
  labels:
    app.kubernetes.io/name: dataspoke-api
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8002
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: dataspoke-api
{{- end }}
