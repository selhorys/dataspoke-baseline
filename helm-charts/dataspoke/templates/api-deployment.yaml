{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataspoke-api
  labels:
    app.kubernetes.io/name: dataspoke-api
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: dataspoke-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dataspoke-api
      {{/*
        envFrom env vars are evaluated only at container start; a Secret or
        ConfigMap content change does not restart consumers. These checksum
        annotations force a rolling restart whenever rendered Secret/ConfigMap
        content changes.
      */}}
      annotations:
        {{- if .Values.secrets.createSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.config.createConfigMap }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
    spec:
      enableServiceLinks: false
      {{- if .Values.api.secretReader.enabled }}
      serviceAccountName: {{ include "dataspoke.fullname" . }}-api
      {{- end }}
      {{- with .Values.api.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.api.migrate.enabled }}
      initContainers:
        - name: alembic-migrate
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            {{- if .Values.config.createConfigMap }}
            - configMapRef:
                name: {{ include "dataspoke.fullname" . }}-app-config
            {{- end }}
            {{- if .Values.secrets.createSecret }}
            - secretRef:
                name: {{ include "dataspoke.fullname" . }}-secrets
            {{- end }}
          resources: {{- toYaml .Values.api.migrate.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 8002
              protocol: TCP
          envFrom:
            {{- if .Values.config.createConfigMap }}
            - configMapRef:
                name: {{ include "dataspoke.fullname" . }}-app-config
            {{- end }}
            {{- if .Values.secrets.createSecret }}
            - secretRef:
                name: {{ include "dataspoke.fullname" . }}-secrets
            {{- end }}
          env:
            - name: DATASPOKE_TEST_MODE
              value: {{ .Values.api.testMode | default false | quote }}
            - name: DATASPOKE_TEST_LLM_REAL
              value: {{ .Values.api.testLlmReal | default false | quote }}
            - name: DATASPOKE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dataspoke-internal-auth
                  key: token
            - name: DATASPOKE_ENABLE_STUB_AUTH
              value: {{ .Values.api.enableStubAuth | default false | quote }}
          startupProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
{{- end }}
