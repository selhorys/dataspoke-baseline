{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataspoke-api
  labels:
    app.kubernetes.io/name: dataspoke-api
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: dataspoke-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dataspoke-api
      {{/*
        envFrom env vars are evaluated only at container start; a Secret or
        ConfigMap content change does not restart consumers. These checksum
        annotations force a rolling restart whenever rendered content changes.
        The secret checksum uses `lookup` against a live cluster; during
        `helm template` / `helm diff` it returns empty (no cluster), which is
        safe — dry-runs don't restart pods.
      */}}
      {{- $secretName := .Values.secrets.existingSecret | default "dataspoke-secrets" }}
      {{- $secretData := (lookup "v1" "Secret" .Release.Namespace $secretName).data | default dict }}
      annotations:
        checksum/secret: {{ $secretData | toJson | sha256sum }}
        {{- if .Values.config.createConfigMap }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      enableServiceLinks: false
      {{- if .Values.api.secretReader.enabled }}
      serviceAccountName: {{ include "dataspoke.fullname" . }}-api
      {{- end }}
      {{- with .Values.api.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.api.waitForDeps.enabled .Values.api.migrate.enabled }}
      initContainers:
        {{- if .Values.api.waitForDeps.enabled }}
        - name: wait-for-postgres
          image: {{ .Values.api.waitForDeps.image }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL at ${DATASPOKE_POSTGRES_HOST}:${DATASPOKE_POSTGRES_PORT:-5432}..."
              until nc -z "${DATASPOKE_POSTGRES_HOST}" "${DATASPOKE_POSTGRES_PORT:-5432}"; do
                echo "  postgres not ready — retrying in 3s"; sleep 3
              done
              echo "PostgreSQL is reachable; proceeding."
          envFrom:
            {{- if .Values.config.createConfigMap }}
            - configMapRef:
                name: {{ include "dataspoke.fullname" . }}-app-config
                optional: true
            {{- end }}
            - secretRef:
                name: {{ .Values.secrets.existingSecret | default "dataspoke-secrets" }}
                optional: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
        {{- end }}
        {{- if .Values.api.migrate.enabled }}
        - name: alembic-migrate
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            {{- if .Values.config.createConfigMap }}
            - configMapRef:
                name: {{ include "dataspoke.fullname" . }}-app-config
            {{- end }}
            - secretRef:
                name: {{ .Values.secrets.existingSecret | default "dataspoke-secrets" }}
          resources: {{- toYaml .Values.api.migrate.resources | nindent 12 }}
        {{- end }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 8002
              protocol: TCP
          envFrom:
            {{- if .Values.config.createConfigMap }}
            - configMapRef:
                name: {{ include "dataspoke.fullname" . }}-app-config
            {{- end }}
            - secretRef:
                name: {{ .Values.secrets.existingSecret | default "dataspoke-secrets" }}
          startupProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
{{- end }}
