{{/*
  No K8s resources are templated here — credentials are pre-created by
  install.sh (dev) or by the operator (prod) as a K8s Secret named
  "dataspoke-secrets" (or .Values.secrets.existingSecret if overridden).

  The Secret must contain these 11 keys:
    DATASPOKE_POSTGRES_PASSWORD,
    DATASPOKE_REDIS_PASSWORD, DATASPOKE_AIRFLOW_USER, DATASPOKE_AIRFLOW_PASSWORD,
    DATASPOKE_INTERNAL_TOKEN, DATASPOKE_JWT_SECRET_KEY,
    DATASPOKE_AIRFLOW_WEBSERVER_SECRET_KEY, DATASPOKE_AIRFLOW_JWT_SECRET,
    DATASPOKE_AIRFLOW_FERNET_KEY,
    DATASPOKE_OAUTH_STATE_SECRET, DATASPOKE_GOOGLE_OAUTH_CLIENT_SECRET

  DATASPOKE_POSTGRES_USER and DATASPOKE_POSTGRES_DB are NOT part of this
  Secret — they are non-secret and live in the app ConfigMap
  (dataspoke-app-config, config.postgres.{user,db}) instead, which is also
  where the render-time consistency guard against postgresql.auth.* lives
  (templates/configmap.yaml). A Secret still carrying either key fails prod
  pre-flight (install.sh _check_airflow_credentials_prod) rather than being
  silently ignored.

  Guard: on a live cluster install, if the Secret is absent, pods will enter
  CrashLoopBackOff immediately. install.sh's _ensure_dataspoke_secrets function
  prevents this in dev; prod operators must pre-create the Secret before running
  helm upgrade --install.

  lookup-based guard is omitted intentionally: `lookup` returns an empty dict
  during `helm template` / `helm diff` (no live cluster), making it impossible
  to distinguish "dry-run" from "Secret genuinely missing" at template time.
  The install.sh pre-flight is the authoritative enforcement path.
*/}}
{{- $secretName := .Values.secrets.existingSecret | default "dataspoke-secrets" }}
{{- /* Emit nothing — Secret is pre-created externally. */ -}}
