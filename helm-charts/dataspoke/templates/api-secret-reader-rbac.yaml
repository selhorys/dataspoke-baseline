{{- if .Values.api.secretReader.enabled }}
{{/*
  ServiceAccount used by the API pod to call the in-cluster Kubernetes Secret API.
  The Deployment references this SA via serviceAccountName (see api-deployment.yaml).
  When secretReader.enabled=false the Deployment falls back to the default SA, which
  has no secret permissions and the resolver raises SecretResolverUnavailable.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dataspoke.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dataspoke.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
{{/*
  Role in the API's own release namespace — grants get, create, patch on any Secret
  in that namespace. resourceNames is intentionally unset; the unit of access is the
  namespace. delete is omitted: conf DELETE does not auto-clean Secrets (reference
  counting is out of scope; see spec/feature/SECRET_RESOLUTION.md §Open Questions).
  Single-namespace policy: no cross-namespace Roles or RoleBindings are rendered.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dataspoke.fullname" . }}-api-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dataspoke.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dataspoke.fullname" . }}-api-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dataspoke.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dataspoke.fullname" . }}-api-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "dataspoke.fullname" . }}-api
    namespace: {{ .Release.Namespace }}
{{- end }}
