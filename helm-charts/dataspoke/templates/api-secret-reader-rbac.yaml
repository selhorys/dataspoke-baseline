{{- if .Values.api.secretReader.enabled }}
{{/*
  ServiceAccount used by the API pod to call the in-cluster Kubernetes Secret API.
  The Deployment references this SA via serviceAccountName (see api-deployment.yaml).
  When secretReader.enabled=false the Deployment falls back to the default SA, which
  has no secret permissions and the resolver raises SecretResolverUnavailable.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dataspoke.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dataspoke.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
{{/*
  Role in the API's own release namespace. resourceNames is intentionally unset;
  the unit of access is the namespace. Single-namespace policy: no cross-namespace
  Roles or RoleBindings are rendered.

  Verbs granted:
  - get   : resolve source-cred refs at run time + read infra Secrets (datahub/llm/langfuse/smtp)
  - list  : enumerate dataspoke-source-cred-* refs for GET /spoke/ingestion/secrets
  - create: infra admin accessors (datahub/llm/langfuse/smtp _secret.py) create on first PATCH
  - patch : infra admin accessors update existing infra Secrets on subsequent PATCHes

  delete is intentionally omitted: conf DELETE does not auto-clean Secrets (reference
  counting is out of scope; see spec/feature/SECRET_RESOLUTION.md §Open Questions).
  The source-cred resolver never issues write verbs; the security property "DataSpoke
  does not mutate dataspoke-source-cred-* Secrets" is enforced in application code
  (secret_resolver.py prefix guard), not at the RBAC layer, because this single Role
  also serves the infra accessors that legitimately need create/patch.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dataspoke.fullname" . }}-api-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dataspoke.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dataspoke.fullname" . }}-api-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dataspoke.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dataspoke.fullname" . }}-api-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "dataspoke.fullname" . }}-api
    namespace: {{ .Release.Namespace }}
{{- end }}
