{{- if .Values.config.createConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dataspoke.fullname" . }}-app-config
  labels:
    {{- include "dataspoke.labels" . | nindent 4 }}
data:
  DATASPOKE_POSTGRES_HOST: {{ .Values.config.postgres.host | quote }}
  DATASPOKE_POSTGRES_PORT: {{ .Values.config.postgres.port | quote }}
  # Guarded on .Values.postgresql.enabled — with the bundled subchart off there
  # is no postgresql.auth.* to compare against, and the role/database names
  # are then entirely the external database's to define.
  {{- if and .Values.postgresql.enabled (ne (.Values.config.postgres.user | toString) (.Values.postgresql.auth.username | toString)) }}
  {{- fail (printf "config.postgres.user (%q) disagrees with postgresql.auth.username (%q) — the latter is the only Postgres role the bundled subchart's initdb actually creates, so a mismatch here passes every pre-flight and deploys a healthy-looking stack whose API then fails Postgres authentication against a role that was never created. The role is chart-pinned, not operator-choosable: it also appears as a bare literal in primary.initdb.scripts' GRANT/OWNER statements (both dataspoke/values.yaml and values-dev.yaml) and in install.sh's _derive_airflow_metadata_secret, neither of which this guard reaches. This guard catches one-sided drift only — it does not make the role changeable." (.Values.config.postgres.user | toString) (.Values.postgresql.auth.username | toString)) }}
  {{- end }}
  DATASPOKE_POSTGRES_USER: {{ .Values.config.postgres.user | quote }}
  {{- if and .Values.postgresql.enabled (ne (.Values.config.postgres.db | toString) (.Values.postgresql.auth.database | toString)) }}
  {{- fail (printf "config.postgres.db (%q) disagrees with postgresql.auth.database (%q) — the latter is the only database the bundled subchart's initdb actually creates, so a mismatch here passes every pre-flight and deploys a healthy-looking stack whose API then fails to find its database. Unlike the role above, this is a clean two-site change: initdb's scripts run against postgresql.auth.database as their default connection and never name the database as a literal, so this guard fully covers it." (.Values.config.postgres.db | toString) (.Values.postgresql.auth.database | toString)) }}
  {{- end }}
  DATASPOKE_POSTGRES_DB: {{ .Values.config.postgres.db | quote }}
  DATASPOKE_REDIS_HOST: {{ .Values.config.redis.host | quote }}
  DATASPOKE_REDIS_PORT: {{ .Values.config.redis.port | quote }}
  DATASPOKE_AIRFLOW_URL: {{ .Values.config.airflow.url | quote }}
  DATASPOKE_AIRFLOW_CALLBACK_BASE_URL: {{ .Values.config.airflow.callbackBaseUrl | quote }}
  DATASPOKE_CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  {{- if not (regexMatch "^[1-9][0-9]*$" (toString .Values.config.rateLimitPerMinute)) }}
  {{- fail (printf "config.rateLimitPerMinute must be a positive integer, got %v — a non-positive or non-integer value silently defeats or breaks the rate limiter (see values.yaml's config.rateLimitPerMinute comment and src/api/middleware/rate_limit.py)." .Values.config.rateLimitPerMinute) }}
  {{- end }}
  DATASPOKE_RATE_LIMIT_PER_MINUTE: {{ .Values.config.rateLimitPerMinute | quote }}
  DATASPOKE_COOKIE_SECURE: {{ .Values.auth.cookieSecure | quote }}
  DATASPOKE_GOOGLE_OAUTH_CLIENT_ID: {{ .Values.auth.googleClientId | quote }}
  DATASPOKE_OAUTH_POST_LOGIN_REDIRECT: {{ .Values.config.oauthPostLoginRedirect | quote }}
  # NOT a DATASPOKE_-prefixed app setting — this is uvicorn's own env var,
  # read by uvicorn's own uvicorn/config.py (server layer), not by Pydantic
  # Settings in src/shared/settings.py. Do not rename it to match the
  # DATASPOKE_ convention; uvicorn only recognizes this exact name.
  # See values.yaml's config.trustedProxyIps comment for why this exists,
  # why the default is loopback-only, and why it must never be "*" or
  # widened without naming the ingress controller's actual pod CIDR.
  {{- $trustedProxyIps := .Values.config.trustedProxyIps | toString }}
  {{- if or (not .Values.config.trustedProxyIps) (eq $trustedProxyIps "*") (regexMatch "(^|,)\\s*(0\\.0\\.0\\.0/0|::/0)\\s*(,|$)" $trustedProxyIps) }}
  {{- fail (printf "config.trustedProxyIps must not be empty, \"*\", or include the all-address network 0.0.0.0/0 / ::/0 (got %q) — any of these silently defeat the rate limiter's client-IP attribution (see values.yaml's config.trustedProxyIps comment). Set it to \"127.0.0.1\" (default, single global bucket) or to \"127.0.0.1,<ingress controller's pod CIDR>\" for per-client limits. This check only catches the literal all-address forms above — other over-broad ranges (e.g. the full RFC1918 space) render successfully and are on you to avoid." $trustedProxyIps) }}
  {{- end }}
  FORWARDED_ALLOW_IPS: {{ .Values.config.trustedProxyIps | quote }}
{{- end }}
