{{- if .Values.config.createConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dataspoke.fullname" . }}-app-config
  labels:
    {{- include "dataspoke.labels" . | nindent 4 }}
data:
  DATASPOKE_DATAHUB_GMS_URL: {{ .Values.config.datahub.gmsUrl | quote }}
  DATASPOKE_DATAHUB_KAFKA_BROKERS: {{ .Values.config.datahub.kafkaBrokers | quote }}
  DATASPOKE_POSTGRES_HOST: {{ .Values.config.postgres.host | quote }}
  DATASPOKE_POSTGRES_PORT: {{ .Values.config.postgres.port | quote }}
  DATASPOKE_POSTGRES_DB: {{ .Values.config.postgres.db | quote }}
  DATASPOKE_REDIS_HOST: {{ .Values.config.redis.host | quote }}
  DATASPOKE_REDIS_PORT: {{ .Values.config.redis.port | quote }}
  DATASPOKE_AIRFLOW_URL: {{ .Values.config.airflow.url | quote }}
  DATASPOKE_AIRFLOW_CALLBACK_BASE_URL: {{ .Values.config.airflow.callbackBaseUrl | quote }}
  DATASPOKE_LLM_PROVIDER: {{ .Values.config.llm.provider | quote }}
  DATASPOKE_LLM_MODEL: {{ .Values.config.llm.model | quote }}
  DATASPOKE_ONTOGEN_DEBATE_MAX_TURNS: {{ .Values.config.ontogen.debateMaxTurns | quote }}
  DATASPOKE_ONTOGEN_DEBATE_RAG_K: {{ .Values.config.ontogen.debateRagK | quote }}
  DATASPOKE_ONTOGEN_DEBATE_REVIEWER_MODEL: {{ .Values.config.ontogen.debateReviewerModel | quote }}
  DATASPOKE_CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
{{- end }}
