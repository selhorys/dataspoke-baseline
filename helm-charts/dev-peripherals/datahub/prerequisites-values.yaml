# DataHub prerequisites Helm values — dev sizing
# Chart: datahub/datahub-prerequisites version 0.3.0
# Topology changes from 0.2.x:
#   - Kafka moves to KRaft; a single `controller` pod serves as broker (no Zookeeper).
#   - OpenSearch replaces Elasticsearch as the default search engine.
# Total memory limits (prerequisites): ~6 GiB

# ----------------------------------------------------------------------------
# Bitnami Kafka in KRaft mode
#   controller.controllerOnly=false → the single controller pod also acts
#   as broker, so broker.replicaCount=0 (no separate broker StatefulSet).
#   Listeners: CLIENT (9092) in-cluster, INTERBROKER (9094) self-talk,
#   EXTERNAL (9095) → nginx-ingress TCP passthrough on DATASPOKE_KUBE_INGRESS_IP:9005.
#   The full advertisedListeners string (CLIENT, INTERNAL, and EXTERNAL entries)
#   is built and injected by bin/dev-peripherals/datahub.sh via --set-string from the
#   DataHub namespace + resolved TCP host; static YAML can't know these values.
# ----------------------------------------------------------------------------
kafka:
  enabled: true
  heapOpts: "-Xms512m -Xmx1536m"
  kraft:
    enabled: true
  zookeeper:
    enabled: false
  controller:
    replicaCount: 1
    controllerOnly: false
    # Annotation-only eviction guard. The Bitnami kafka chart defaults
    # controller.pdb.maxUnavailable: 1 and renders minAvailable/maxUnavailable
    # independently, so adding minAvailable here would emit an invalid both-fields
    # PodDisruptionBudget that the apiserver rejects. kafka is DataHub's event bus,
    # not the metadata store, so the autoscaler annotation alone is sufficient.
    podAnnotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    resources:
      requests:
        cpu: "250m"
        memory: "1Gi"
        ephemeral-storage: "2Gi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
        ephemeral-storage: "4Gi"
    extraConfig: |
      message.max.bytes=5242880
      default.replication.factor=1
      offsets.topic.replication.factor=1
      transaction.state.log.replication.factor=1
      num.partitions=3
      num.io.threads=4
      num.network.threads=4
      num.replica.fetchers=1
      log.retention.hours=24
      log.retention.bytes=268435456
      log.segment.bytes=67108864
      log.cleaner.enable=true
  broker:
    replicaCount: 0
  listeners:
    client:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
    # KRaft controller listener is required when controller.controllerOnly=false;
    # it carries the raft consensus plane between controller pods. Must appear in
    # overrideListeners + securityProtocolMap below. Not advertised to clients.
    controller:
      name: CONTROLLER
      containerPort: 9093
      protocol: PLAINTEXT
    external:
      containerPort: 9095
      protocol: PLAINTEXT
      name: EXTERNAL
    overrideListeners: "CONTROLLER://:9093,CLIENT://:9092,INTERNAL://:9094,EXTERNAL://:9095"
    securityProtocolMap: "CONTROLLER:PLAINTEXT,CLIENT:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
    # advertisedListeners is injected by bin/dev-peripherals/datahub.sh via --set-string
    # (it embeds the DataHub namespace + external host, which static YAML can't know)
    # — do not hardcode it here.

# Confluent Platform disabled (bitnami kafka is used instead)
cp-helm-charts:
  enabled: false
  cp-schema-registry:
    enabled: false

# ----------------------------------------------------------------------------
# OpenSearch (chart default; replaces Elasticsearch from 0.2.x)
#   singleNode=true skips bootstrap checks (no vm.max_map_count sysctl).
#   Security plugin disabled to match chart convention; DataHub auth is
#   handled in GMS/frontend, not the search index.
# ----------------------------------------------------------------------------
opensearch:
  enabled: true
  singleNode: true
  # Annotation-only eviction guard. The opensearch chart's PDB supports only
  # maxUnavailable, gated on a truthy value: maxUnavailable:0 (which would actually
  # block disruption) is falsy and renders no PDB, while any positive value permits
  # that many disruptions. A PDB therefore cannot protect this single-node install;
  # the safe-to-evict annotation is the effective guard.
  podAnnotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
  config:
    opensearch.yml: |
      plugins:
        security:
          disabled: true
  extraEnvs:
    - name: DISABLE_INSTALL_DEMO_CONFIG
      value: "true"
  image:
    tag: "2.19.5"
  opensearchJavaOpts: "-Xms1g -Xmx1g"
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
      ephemeral-storage: "2Gi"
    limits:
      cpu: "2000m"
      memory: "3Gi"
      ephemeral-storage: "4Gi"
  # --- GKE Autopilot compatibility ---
  # Autopilot blocks privileged sysctl init containers that raise
  # vm.max_map_count. singleNode=true above already skips the mmapfs
  # bootstrap check so the sysctl init container is unnecessary.
  sysctl:
    enabled: false
  sysctlInit:
    enabled: false

# Elasticsearch disabled (chart default; we use OpenSearch instead)
elasticsearch:
  enabled: false

# Bitnami MySQL
mysql:
  enabled: true
  auth:
    existingSecret: "mysql-secrets"
    # Secret must contain keys: mysql-root-password, mysql-password
  primary:
    extraFlags: "--character-set-server=utf8mb4 --collation-server=utf8mb4_bin"
    # Bitnami mysql primary eviction resilience keys (verified against bundled chart).
    podAnnotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    pdb:
      create: true
      minAvailable: 1
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
        ephemeral-storage: "2Gi"
      limits:
        cpu: "1000m"
        memory: "1536Mi"
        ephemeral-storage: "4Gi"
    persistence:
      enabled: true
      size: 10Gi
    startupProbe:
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 15
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5

# Neo4j disabled — using OpenSearch as graph backend (upstream default)
neo4j:
  enabled: false
