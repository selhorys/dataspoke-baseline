# nginx-ingress controller values — MANAGED ingress mode only (GKE Autopilot / minikube).
#
# Applied by helm-charts/bin/dev-peripherals/nginx-ingress.sh when
# DATASPOKE_KUBE_INGRESS_MODE=managed (the default). DataSpoke installs and owns
# the controller and its LoadBalancer. In shared mode the script reuses a
# pre-existing cluster controller and never reads this file.
#
# Installed as Helm release "ingress-nginx" in namespace "ingress-nginx".
# The tcp: block below uses __*_NS__ placeholders which bin/dev-peripherals/nginx-ingress.sh
# renders from the active .env (DATASPOKE_KUBE_DATASPOKE_NAMESPACE,
# DATASPOKE_DEV_KUBE_DATAHUB_NAMESPACE, DATASPOKE_DEV_KUBE_DUMMY_DATA_NAMESPACE)
# before passing to helm. Do not hardcode namespaces here.

controller:
  ingressClassResource:
    name: nginx
    default: true
  service:
    type: LoadBalancer
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # GKE Autopilot scales from 0 nodes, so the admission webhook's pre-install
  # hook Job cannot schedule before Helm's hook-wait times out. The webhook is
  # optional Ingress validation we don't need in dev — disabling it removes the
  # admission-create/patch hook Jobs that block install.
  admissionWebhooks:
    enabled: false

# TCP services — maps LoadBalancer ports to in-cluster services.
# The ingress-nginx chart creates a ConfigMap called "tcp-services" from
# this map and adds the ports to the controller's Service automatically.
#
# Format: "<external-port>": "<namespace>/<service-name>:<target-port>"
#
# Tier B: dev-only TCP passthrough for datastores and message brokers.
tcp:
  # DataSpoke infra (__DATASPOKE_NS__)
  9201: "__DATASPOKE_NS__/dataspoke-postgresql:5432"
  9202: "__DATASPOKE_NS__/dataspoke-redis-master:6379"
  # DataHub Kafka (__DATAHUB_NS__)
  9005: "__DATAHUB_NS__/datahub-kafka-external:9095"
  # Example data sources (__DUMMY_DATA_NS__)
  9102: "__DUMMY_DATA_NS__/example-postgres:5432"
  9104: "__DUMMY_DATA_NS__/example-kafka:9094"
  # Dev-env lock service (__DATASPOKE_NS__)
  9221: "__DATASPOKE_NS__/dev-lock:8080"
