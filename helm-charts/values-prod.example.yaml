# ==============================================================================
# DataSpoke — Prod Operator Values Overlay (EXAMPLE)
# ==============================================================================
# Copy this file, edit the placeholders, and pass it to install.sh:
#
#   ./helm-charts/bin/install.sh --profile prod \
#     --values /path/to/your-overlay.yaml \
#     --image-tag 1.2.3
#
# This is an OVERLAY on top of helm-charts/dataspoke/values.yaml (the umbrella
# chart's prod defaults) — you only need to set the keys that differ for your
# environment. Everything not repeated here inherits the base default.
#
# ------------------------------------------------------------------------------
# MERGE SEMANTICS FOOTGUN — read this before writing your overlay
# ------------------------------------------------------------------------------
# Helm merges an extra -f file onto the chart's values.yaml with plain YAML
# semantics: maps MERGE key-by-key (a key you don't repeat here survives
# untouched from values.yaml); lists REPLACE wholesale (this is why the
# ingress blocks below always show the complete hosts/tls list, not a diff).
#
# Consequence: values.yaml sets `cert-manager.io/cluster-issuer:
# letsencrypt-prod` on all three ingresses below. If your cluster does NOT run
# cert-manager, that annotation survives an overlay that only sets other
# annotation keys, because the map merges rather than replaces. The fix
# differs per ingress (each verified with `helm template` against this file):
#   - api: setting the key to `null` here deletes it — the rendered manifest
#     carries no `cert-manager.io/cluster-issuer` annotation at all.
#   - frontend: setting the key to `null` here does NOT delete it — it
#     renders as a literal `cert-manager.io/cluster-issuer: null`, which
#     Kubernetes coerces to an empty string at apply time (harmless with no
#     cert-manager installed, but a drift-detector that flags any
#     `cert-manager.io/*` key presence will still fire).
#   - airflow: setting the key to `null` here FAILS `helm template` outright —
#     the Apache Airflow chart's `values.schema.json` requires a string for
#     this annotation. Use an empty string `""` instead, or leave the
#     annotation as `letsencrypt-prod` if an inert cert-manager key is fine.
#
#   api:
#     ingress:
#       annotations:
#         cert-manager.io/cluster-issuer: null   # deletes the key — see above
#   frontend:
#     ingress:
#       annotations:
#         cert-manager.io/cluster-issuer: null   # renders as "" — see above
#   airflow:
#     ingress:
#       apiServer:
#         annotations:
#           cert-manager.io/cluster-issuer: ""   # null FAILS helm template here — see above
#
# Verified against helm v3.18.4 (the live binary available here) against the
# vendored charts/airflow-1.20.0.tgz — the only version pair verified. How a
# subchart's values.schema.json treats a null-valued key has varied across
# helm minor releases, so confirm the three behaviors above against your own
# binary if you are not on v3.18.4. A downstream report on helm v3.14.3
# claims `null` removes the cert-manager.io/cluster-issuer key cleanly on all
# three ingresses below — that does NOT reproduce at v3.18.4, where the
# per-ingress split above still holds. This header states only what was
# tested, not a version range.
#
# ------------------------------------------------------------------------------
# NO CREDENTIALS IN THIS FILE
# ------------------------------------------------------------------------------
# Nothing secret belongs in this overlay — no passwords, tokens, API keys, or
# OAuth client secrets. Every credential the umbrella chart consumes at runtime
# is read from a Kubernetes Secret you pre-create out-of-band. For a real
# deployment, deliver it via ExternalSecrets, Vault, or SealedSecrets; a plain
# `kubectl create secret generic` is only the floor for a one-off bootstrap
# (see helm-charts/README.md §2 for the safe form of that command — plain
# `--from-literal=` leaks every value into shell history and process argv).
# Name whichever mechanism you use via secrets.existingSecret below. See
# helm-charts/README.md §Prod profile for the full list of required Secret
# keys and the install.sh preflight checks that validate them before anything
# gets deployed.
# ==============================================================================


# ------------------------------------------------------------------------------
# Frontend — Ingress + runtime config
# ------------------------------------------------------------------------------
frontend:
  ingress:
    enabled: true
    className: "nginx"          # ignored — install.sh --sets it from DATASPOKE_KUBE_INGRESS_CLASS
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"   # no cert-manager? set to null — renders as "" (see header)
    hosts:
      - host: app.dataspoke.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: dataspoke-frontend-tls
        hosts:
          - app.dataspoke.example.com
  # Runtime config injected server-side into the Next.js container (not baked
  # at build time) — safe to change per environment without rebuilding the image.
  config:
    apiBaseUrl: "https://api.dataspoke.example.com"
    airflowUrl: "https://airflow.dataspoke.example.com"
  # DataHub and Langfuse deep links are not chart values — they come from the
  # DB `peripheral_config` table, wired after install via
  #   PATCH /api/v1/admin/peripherals/datahub   {"frontend_url": "..."}
  #   PATCH /api/v1/admin/peripherals/langfuse  {"host": "...", "project_id": "..."}
  # `frontend_url` is the browser-facing DataHub UI URL — not `gms_url`, which
  # addresses the GMS service and routinely differs in host, port, and scheme.
  # See helm-charts/README.md §Prod profile step 7.


# ------------------------------------------------------------------------------
# API — image pull secret + Ingress
# ------------------------------------------------------------------------------
api:
  # Only needed when your registry requires auth to pull (private ECR/Artifact
  # Registry/Docker Hub repo). Create the Secret first:
  #   kubectl create secret docker-registry my-registry-pull-secret \
  #     --docker-server=<registry> --docker-username=<u> --docker-password=<p> \
  #     -n <DATASPOKE_KUBE_DATASPOKE_NAMESPACE>
  #
  # SCOPE: today only the API Deployment threads a pull secret (this key —
  # dataspoke/templates/api-deployment.yaml). Postgres and Airflow pull images
  # from the same private registry and need their own subchart-native keys if
  # your registry requires auth — set them alongside this one:
  #   postgresql:
  #     global:
  #       imagePullSecrets:
  #         - my-registry-pull-secret
  #   airflow:
  #     imagePullSecrets:
  #       - name: my-registry-pull-secret
  # The frontend subchart does not support imagePullSecrets at all yet — a
  # private-registry operator running `--frontend cluster` will see
  # ImagePullBackOff on that workload regardless of what you set here.
  imagePullSecrets:
    - name: my-registry-pull-secret
  ingress:
    enabled: true
    className: "nginx"          # ignored — install.sh --sets it from DATASPOKE_KUBE_INGRESS_CLASS
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"   # no cert-manager? set to null — this deletes the key (see header)
    hosts:
      # MUST be api.<the same domain you use everywhere else in this overlay> —
      # helm-charts/bin/post-install/seed-admin-user.sh hardcodes
      # <scheme>://api.<DATASPOKE_KUBE_INGRESS_DOMAIN>/internal/admin/bootstrap,
      # so a mismatched host here breaks the manual admin seed step.
      - host: api.dataspoke.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: dataspoke-api-tls
        hosts:
          - api.dataspoke.example.com


# ------------------------------------------------------------------------------
# Airflow — chart-native Ingress (api-server UI)
# ------------------------------------------------------------------------------
airflow:
  ingress:
    apiServer:
      enabled: true
      ingressClassName: "nginx"   # ignored — install.sh --sets it from DATASPOKE_KUBE_INGRESS_CLASS
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "false"
        cert-manager.io/cluster-issuer: "letsencrypt-prod"   # no cert-manager? set to "" — `null` FAILS helm template here (see header)
      hosts:
        # Apache Airflow chart per-host shape: one host entry, tls nested under it
        # (not a sibling `tls:` list like frontend/api above).
        - name: airflow.dataspoke.example.com
          tls:
            enabled: true
            secretName: dataspoke-airflow-tls


# ------------------------------------------------------------------------------
# Shared application config (CORS + OAuth redirect)
# ------------------------------------------------------------------------------
config:
  # postgres.user/db need no override here — the chart default
  # ("dataspoke"/"dataspoke") already matches dataspoke/values.yaml's
  # postgresql.auth.username/database. The role is chart-pinned; changing it
  # is unsupported (see values.yaml's config.postgres comment). The database
  # name is a clean two-site value — if you need a different one, set BOTH
  # this and postgresql.auth.database consistently:
  # postgres:
  #   db: "your-database-name"
  # Origins allowed to call the API cross-origin — must include every host
  # that serves the frontend (comma-separated, no spaces).
  corsOrigins: "https://app.dataspoke.example.com"
  # Where the Google/OIDC callback 302-redirects after login. Must point at
  # the frontend origin above; the default "/" only works when UI and API
  # share a host, which is not the case once you split app./api. subdomains.
  oauthPostLoginRedirect: "https://app.dataspoke.example.com/"
  # Max requests per minute per rate-limit key (JWT sub, falling back to
  # client IP — see trustedProxyIps below for how that IP is attributed).
  # Chart default is 120; uncomment to tune. Must be a positive integer.
  # helm-charts/dataspoke/templates/configmap.yaml render-fails the install
  # for ANY other value before it ever reaches a pod — verified with `helm
  # template`: 0, a negative number, and null all fail the render exactly
  # like a non-numeric string ("config.rateLimitPerMinute must be a positive
  # integer, got <value>"). There is no live path where an invalid value
  # here reaches the API pod and pydantic Settings parsing.
  # rateLimitPerMinute: 120
  # Proxies uvicorn trusts to read X-Forwarded-For / X-Forwarded-Proto — the
  # client IP is the rate-limit key above for unauthenticated traffic, so
  # this is the only knob between per-client buckets and one shared bucket
  # keyed on the ingress controller's own pod IP (the chart default, safe
  # but coarse). Opt in by naming your ingress controller's actual pod CIDR,
  # e.g. "127.0.0.1,10.4.0.0/14" — NEVER widen to the full RFC1918 space or
  # "*": uvicorn applies the trust list to every hop of X-Forwarded-For, so
  # an over-broad range lets any reachable caller forge a fresh IP per
  # request and get a fresh bucket every time, defeating the only
  # brute-force control on POST /auth/token. Widening this also flips the
  # OAuth redirect_uri scheme from http:// to https://, since uvicorn
  # applies the same trust gate to X-Forwarded-Proto — re-verify your
  # Google Cloud Console redirect URI before rolling out a widened value.
  # The chart render fails on an empty value, "*", or a literal 0.0.0.0/0 /
  # ::/0 entry — but that check is literal-only: it does NOT catch other
  # over-broad ranges (e.g. the full RFC1918 space warned about above), which
  # render and deploy successfully. Never widen this beyond your ingress
  # controller's actual pod CIDR, guard or no guard. See dataspoke/values.yaml's
  # trustedProxyIps comment and spec/feature/AUTH.md §Client-IP attribution
  # for rate limiting.
  # Deriving the value on a VPC-CNI cluster differs by provider — the two
  # shapes below are NOT interchangeable:
  #   - AWS VPC CNI (EKS): pod IPs come straight from ENI-attached VPC subnet
  #     addresses, so `.spec.podCIDR` is empty on every Node —
  #     `kubectl get nodes -o
  #     custom-columns=NAME:.metadata.name,PODCIDR:.spec.podCIDR` prints
  #     `<none>` for all of them, and there is no single CIDR to read off
  #     the cluster. Name the node/worker subnet(s) your ingress
  #     controller's pods can be scheduled onto instead (from your cloud
  #     console or a Node's `.status.addresses`) — on this CNI, pod and node
  #     IPs share the same address space.
  #   - GKE VPC-native / alias-IP clusters: pods DO get a real cluster-wide
  #     pod range — a secondary range sliced into a /24 per Node, readable
  #     as `.spec.podCIDR` on any Node or as the cluster's `clusterIpv4Cidr`.
  #     Name that pod secondary range, NOT the node/worker subnet — the two
  #     are disjoint on this CNI. The shipped example below (`10.4.0.0/14`)
  #     is exactly that shape, not a node subnet.
  # The two error directions are NOT symmetric. Too narrow fails safe: the
  # forwarded header is ignored, every request is attributed to the ingress
  # controller's own pod IP, and the whole deployment shares one coarse
  # bucket — cheap to deny service to, but the limiter still counts. Too
  # wide fails OPEN: uvicorn applies the trust list to every hop of
  # X-Forwarded-For, so any caller reachable from inside the named range
  # forges a fresh client IP per request, lands in a fresh bucket every
  # time, and is never limited at all — which removes the only brute-force
  # control on POST /auth/token and /auth/register. Err narrow.
  # On the AWS VPC CNI in particular, naming the whole node/worker subnet —
  # because pods and nodes share that address space — trusts every pod
  # scheduled on it, not only the ingress controller's. Narrow the blast
  # radius by scheduling the ingress controller onto a dedicated node
  # group/subnet and naming only that CIDR. The chart's `networkPolicy` is
  # not a mitigation here: it renders `policyTypes: [Egress]` only (a single
  # allow rule to the DataHub namespace), so it restricts no ingress and
  # cannot keep an untrusted pod out of the range you named. When you cannot
  # narrow it, the loopback-only default is the safer trade.
  # trustedProxyIps: "127.0.0.1,10.4.0.0/14"


# ------------------------------------------------------------------------------
# Auth — Google OAuth client ID + cookie policy
# ------------------------------------------------------------------------------
auth:
  # Public client ID only — the paired client secret is NOT set here; it lives
  # in the pre-created Secret as DATASPOKE_GOOGLE_OAUTH_CLIENT_SECRET (see
  # secrets.existingSecret below and helm-charts/README.md §Prod profile).
  googleClientId: "<your-client-id>.apps.googleusercontent.com"
  # Chart default is already true — this line is a reminder, not an override.
  # Leave it true unless your ingress serves plain HTTP with no TLS anywhere
  # in front of the browser (rare, and generally not recommended for prod):
  # a `Secure` cookie is simply dropped by the browser over HTTP, which breaks
  # login rather than merely weakening it.
  cookieSecure: true


# ------------------------------------------------------------------------------
# Event consumer — DataHub Kafka subscriber (disabled by default)
# ------------------------------------------------------------------------------
# Baseline UC1-UC5 are schedule-driven via Airflow and need no Kafka consumer,
# so values.yaml ships `enabled: false`. Enable it only for event-driven
# extensions. It builds no image of its own — it runs the API image under a
# command: override, so `--image-tag` covers both and there is nothing extra to
# push. Kafka brokers and the security tuple (protocol, SASL mechanism,
# username, password) are NOT set here: they live in the DB `peripheral_config`
# row and are configured after install via
# PATCH /api/v1/admin/peripherals/datahub, taking effect without a redeploy.
#
# The one Kafka setting that cannot be configured from the admin API is cloud
# identity. With kafka_sasl_mechanism = AWS_MSK_IAM the consumer authenticates
# as an IAM role rather than a typed credential, so the role is bound to the
# pod's ServiceAccount here, at install time:
#
# event-consumer:
#   enabled: true
#   serviceAccount:
#     create: true
#     annotations:
#       eks.amazonaws.com/role-arn: "arn:aws:iam::<account-id>:role/<msk-consumer-role>"
#
# Two prerequisites live in your cloud account, not in this chart:
#   - an IAM role trusted by the cluster's OIDC provider, granting
#     kafka-cluster:Connect, DescribeTopic, ReadData, DescribeGroup, and
#     JoinGroup on the cluster / topic / consumer-group ARNs;
#   - MSK security-group ingress from the EKS pod network on the IAM listener
#     port (9098).
# When either is missing the consumer starts, fails to authenticate, and
# reports status: error on the `health` field of
# GET /api/v1/admin/peripherals/datahub — the intended diagnostic path.
#
# Setting `serviceAccount.create: false` hands both the ServiceAccount and the
# Role granting it `get` on dataspoke-datahub-secret to you; the chart then
# renders neither. If you supply the ServiceAccount but forget the Role, a
# typed SASL mechanism (PLAIN / SCRAM-*) fails in a way that reads like a wrong
# password: the Secret read is denied, the password resolves empty, and the
# broker rejects the credential. Confirm it by looking for the
# `datahub_secret_rbac_denied` line in the consumer's pod log before rotating
# the password. See spec/feature/HELM_CHART.md
# §Event-consumer identity and RBAC.


# ------------------------------------------------------------------------------
# Secrets — name of your pre-created credential Secret
# ------------------------------------------------------------------------------
secrets:
  # Name of the Kubernetes Secret you created before running install.sh. Must
  # contain all 11 required keys — see helm-charts/README.md §Prod profile.
  # DATASPOKE_POSTGRES_USER and DATASPOKE_POSTGRES_DB do NOT go in this
  # Secret — see the config.postgres comment near the top of this file.
  existingSecret: "dataspoke-secrets-prod"


# ------------------------------------------------------------------------------
# PostgreSQL image registry — NOT settable via this overlay
# ------------------------------------------------------------------------------
# `install.sh` unconditionally passes
#   --set-string postgresql.image.registry=""
#   --set-string postgresql.image.repository=<DATASPOKE_KUBE_IMAGE_REGISTRY>/postgres
#   --set-string postgresql.image.tag=<--image-tag>
# on every prod install, and `--set`/`--set-string` outrank `-f` values files —
# any `postgresql.image.*` you set here is silently discarded (verified with
# `helm template`). There is no per-service registry override today: routing
# Postgres through a different registry than the rest of your images requires
# changing `install.sh`, not this overlay. `DATASPOKE_KUBE_IMAGE_REGISTRY`
# applies to all four built images (api/airflow/postgres/frontend) uniformly.


# ------------------------------------------------------------------------------
# pullPolicy
# ------------------------------------------------------------------------------
# `api`, `event-consumer`, and `frontend` need no manual pullPolicy override —
# `install.sh` already handles image freshness for these three DataSpoke-owned
# workloads on every prod run, by content-addressing the image itself: it
# resolves each one's registry digest and pins `image.digest` (rendering
# `<repository>@sha256:...`) so a rebuild pushed to the same tag still changes
# the pod template and rolls the workload under the chart-default
# `IfNotPresent`. Pass `--no-digest-pin` instead (host cannot reach the
# registry API) and `install.sh` forces `image.pullPolicy=Always` on all three
# itself and issues an explicit `kubectl rollout restart` after the upgrade.
# Either way, any `pullPolicy` you set here for these three is redundant with
# what `install.sh` already does — see `spec/feature/HELM_CHART.md` §Digest
# stamping.
#
# `postgresql` and `airflow` are different: both are third-party subcharts
# `install.sh` never digest-stamps or restarts (§Digest stamping's "airflow
# and postgres are not digest-stamped" note), so if your build pipeline
# reuses a mutable tag for them (e.g. always deploying `:prod`) you must both
# switch their pullPolicy to Always here AND issue the `kubectl rollout
# restart`/`restart statefulset` yourself after every image update — neither
# happens automatically:
#
# postgresql:
#   image:
#     pullPolicy: Always
# airflow:
#   images:
#     airflow:
#       pullPolicy: Always


# ------------------------------------------------------------------------------
# Resource sizing guidance — field-tested, not chart defaults
# ------------------------------------------------------------------------------
# `dataspoke/values.yaml` ships prod defaults for every component — see
# spec/feature/HELM_CHART.md §Resource Sizing → Production defaults for the
# full per-component table. `api`, `frontend`, `postgresql`, and
# `airflow.dagProcessor` are the four components whose chart defaults are
# most commonly tuned for a real workload; the figures below are one
# operator's field-tested numbers for those four, derived from one node
# shape and one workload profile, offered as a starting point to tune from
# rather than a proven floor:
#
# frontend:
#   resources:
#     requests:
#       memory: 384Mi        # chart default: 256Mi
#     limits:
#       cpu: "1"             # chart default: 500m
#       memory: 1024Mi       # chart default: 512Mi
# api:
#   resources:
#     requests:
#       memory: 768Mi        # chart default: 512Mi
#     limits:
#       cpu: 1500m           # chart default: 1
#       memory: 2048Mi       # chart default: 1024Mi
# postgresql:
#   primary:
#     resources:
#       requests:
#         memory: 4096Mi     # chart default: 2048Mi
# airflow:
#   dagProcessor:
#     resources:
#       requests:
#         memory: 768Mi      # chart default: 512Mi
#       limits:
#         memory: 1.5Gi      # chart default: 1Gi (1.5Gi == 1536Mi)
#
# Two rationales worth carrying into your own tuning pass:
#   - Raising the PostgreSQL request is not only a capacity change — under
#     memory pressure the kubelet ranks pods for eviction first by whether
#     usage exceeds the request, then by pod priority, and only then by how
#     far usage sits above the request — so a wide limit-to-request ratio
#     puts Postgres into that first bucket early and makes it an early
#     eviction candidate as soon as its usage climbs past a request that is
#     small relative to its limit. At the chart default's 3x ratio (2048Mi
#     request / 6144Mi limit) that gap is reached quickly. Raising the
#     request narrows the ratio, so Postgres has to exceed its (now larger)
#     request by far more before the kubelet considers it a candidate — it
#     is evicted later, not sooner.
#   - Every row above raises memory further than CPU (frontend and api raise
#     no CPU request at all) — the same asymmetry values.yaml's own
#     airflow.triggerer comment documents: on nodes where allocatable CPU is
#     the scarce dimension, a memory-request increase is often free while
#     each CPU-request increase shrinks the set of nodes a pod can land on.
#
# Field result: the full table above scheduled without autoscaling on a
# 2 vCPU / ~7 GiB-allocatable burstable node pool.


# ------------------------------------------------------------------------------
# StorageClass — pinning a non-default class for Postgres/Redis
# ------------------------------------------------------------------------------
# postgresql.primary.persistence.storageClass and
# redis.{master,replica}.persistence.storageClass (Bitnami spelling — see the
# Airflow log persistence section below for the different apache-airflow
# spelling, storageClassName) each default to your cluster's default
# StorageClass when unset. Pin one only if you need something other than the
# default — a class with a specific disk type, encryption-at-rest, or
# reclaimPolicy:
#
# postgresql:
#   primary:
#     persistence:
#       storageClass: your-storage-class
# redis:
#   master:
#     persistence:
#       storageClass: your-storage-class
#   replica:
#     persistence:
#       storageClass: your-storage-class
#
# Whichever class you pin here must already exist in the cluster BEFORE you
# run install.sh — a namespace-scoped Helm release cannot create a
# cluster-scoped StorageClass for itself. `install.sh --profile prod`
# resolves all fifteen overlay keys this check covers — the three above, the
# top-level `global.defaultStorageClass` / `global.storageClass` fallbacks,
# the same two spelled inside the `postgresql:` and `redis:` blocks (which
# Bitnami's precedence ranks AHEAD of a component's own key, so a pin there
# shadows the three above), and the six Airflow persistence keys below this
# block (`storageClassName` spelling) — and fails on any pinned name
# `kubectl get storageclass` cannot find, before the chart is installed: no
# workload, PVC, or Secret is created off a class the check has not confirmed
# exists. It also rejects a literal `-` on the four Airflow keys that do not
# honour it (see the Airflow log persistence section below). Fifteen covers
# every PVC the shipped architecture provisions; `readReplicas`,
# `backup.cronjob` and `sentinel` are out of scope because the chart pins
# standalone with no backup CronJob and no Sentinel. See prod-prereq/ for what belongs
# there, an example manifest, and the reclaimPolicy/encryption trade-off
# these PVs carry (they hold the Postgres credential store and Redis's AOF
# revocation-key log) — prod-prereq/'s example manifest deliberately pins
# `Retain` rather than the provisioner's usual `Delete`, against losing that
# data to a mistaken PVC or namespace delete, at the cost of a PV that
# outlives its PVC and must be reclaimed by hand.


# ------------------------------------------------------------------------------
# Airflow log persistence (disabled by default)
# ------------------------------------------------------------------------------
# The shipped default runs Airflow task logs to emptyDir — logs do not survive
# a pod restart (see values.yaml airflow.workers.celery.persistence and
# airflow.triggerer.persistence). Uncomment the block below only if you want
# post-mortem log retention across restarts; it provisions a PVC per
# scheduler/triggerer replica (RWO, sized per your storage class). See
# helm-charts/README.md §Prod: what survives an uninstall for what a
# subsequent teardown then leaves behind.
#
# To pin a non-default StorageClass for these PVCs, the key is spelled
# `storageClassName` here (the apache-airflow chart's own spelling), NOT the
# `storageClass` used by the postgresql/redis blocks above — pasting the
# Bitnami spelling here silently pins nothing. It must already exist in the
# cluster; see helm-charts/prod-prereq/. Neither `triggerer.persistence`
# nor `workers.celery.persistence` honours a literal `-` for
# "pre-provisioned PV" the way the Bitnami keys do, and neither exposes an
# `existingClaim` key at all (verified against the subchart's own
# values.yaml — `existingClaim` exists only under `redis`, `dags`, and
# `logs` persistence, not here) — these two keys need an explicit class
# name. Disabling persistence on either (`persistence.enabled: false`, or
# leaving it unset) does not fall back to a pre-provisioned PV; it renders
# an `emptyDir` instead, which is the ephemeral-logs behavior this section
# exists to move away from.
#
# airflow:
#   workers:
#     celery:
#       persistence:
#         enabled: true
#         size: 20Gi
#         # storageClassName: your-storage-class
#   triggerer:
#     persistence:
#       enabled: true
#       size: 20Gi
#       # storageClassName: your-storage-class
