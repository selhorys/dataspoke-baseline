# DataHub Helm values — dev sizing
# Chart: datahub/datahub version 1.0.1 (app version v1.6.0)
# Total memory limits (datahub services): ~6.5 GiB
#
# Service name overrides point to the datahub-prerequisites release.
# Because the prerequisites chart is installed as release name
# "datahub-prerequisites", all internal service names get the
# "datahub-prerequisites-" prefix.

global:
  datahub:
    # Pin every datahub image (gms, frontend, actions, mae/mce, ingestion,
    # system-update, setup jobs) to v1.6.0. Chart 1.0.1 defaults to v1.6.0.
    version: "v1.6.0"
  sql:
    datasource:
      host: "datahub-prerequisites-mysql:3306"
      hostForMysqlClient: "datahub-prerequisites-mysql"
      port: "3306"
      url: "jdbc:mysql://datahub-prerequisites-mysql:3306/datahub?verifyServerCertificate=false&useSSL=true&useUnicode=yes&characterEncoding=UTF-8&enabledTLSProtocols=TLSv1.2"
      driver: "com.mysql.cj.jdbc.Driver"
      username: "root"
      password:
        secretRef: "mysql-secrets"
        secretKey: "mysql-root-password"
  elasticsearch:
    # DataHub's Elasticsearch client is wire-compatible with OpenSearch 2.x.
    # The prerequisites chart now deploys OpenSearch by default; host matches
    # the opensearch subchart service name.
    host: "opensearch-cluster-master"
    port: "9200"
  kafka:
    bootstrap:
      server: "datahub-prerequisites-kafka:9092"
    schemaregistry:
      type: INTERNAL
  graph_service_impl: elasticsearch

datahub-gms:
  # The chart defaults the GMS service to LoadBalancer, which provisions a
  # redundant NLB beside the nginx Ingress and exposes the metadata API plus
  # jmx/prometheus ports. Access is via the nginx Ingress (datahub-gms Ingress
  # at datahub.<domain>/gms), so keep GMS as in-cluster ClusterIP.
  service:
    type: ClusterIP
  extraEnvs:
    # Disable the system-update wait that gates the MAE consumer startup.
    # In dev, the system-update job always completes before GMS boots, so
    # the gate is unnecessary. Without this, the embedded MAE consumer
    # (which indexes timeseries aspects like OperationClass into ES) is
    # stopped during the upgrade check and never restarted — a DataHub bug
    # in the DataHubUpgradeKafkaListener → KafkaInitializationManager flow.
    - name: BOOTSTRAP_SYSTEM_UPDATE_WAIT_FOR_SYSTEM_UPDATE
      value: "false"
  resources:
    requests:
      cpu: "1000m"
      memory: "1536Mi"
      ephemeral-storage: "4Gi"
    limits:
      cpu: "2000m"
      memory: "3Gi"
      ephemeral-storage: "8Gi"
  # Relaxed probes: GMS depends on ES, Kafka, and MySQL.  On a single-node
  # dev cluster a transient ES restart can make /health unreachable for
  # 30-60 s.  failureThreshold × periodSeconds ≈ 2 min tolerance prevents
  # unnecessary GMS restarts during infra recovery.
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 8
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 4

datahub-frontend:
  # Access is served via the nginx Ingress (datahub-frontend Ingress at
  # datahub.<domain>/); avoid a redundant LoadBalancer.
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
      ephemeral-storage: "4Gi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
      ephemeral-storage: "8Gi"
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 6
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Host is overridden by bin/peripherals/datahub.sh --set using DATASPOKE_KUBE_INGRESS_DOMAIN.
    # The placeholder below is intentionally obvious so a missed --set fails loud.
    hosts:
      - host: "REPLACE-WITH-INGRESS-DOMAIN.invalid"
        paths:
          - /

datahub-mae-consumer:
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
      ephemeral-storage: "4Gi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
      ephemeral-storage: "8Gi"

datahub-mce-consumer:
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
      ephemeral-storage: "4Gi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
      ephemeral-storage: "8Gi"

acryl-datahub-actions:
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
      ephemeral-storage: "4Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
      ephemeral-storage: "4Gi"
