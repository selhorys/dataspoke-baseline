# DataSpoke Langfuse Chart — Production Defaults
# Operator: supply a prod-overrides.yaml with real hostnames, TLS secrets,
# external S3/Postgres/Redis endpoints, and ESO wiring.
#
# Key nesting: the upstream Langfuse chart wraps its own config under a
# top-level `langfuse:` key, and Helm passes parent values under the
# dependency name (`langfuse:`) as-is into the subchart. So in this parent
# chart, Langfuse application settings live at `langfuse.langfuse.*`,
# infrastructure settings live at `langfuse.postgresql.*`, etc.

# ---------------------------------------------------------------------------
# Global — Bitnami subchart compatibility
# ---------------------------------------------------------------------------
global:
  security:
    allowInsecureImages: true

# ---------------------------------------------------------------------------
# External secrets integration
# Set externalSecrets.enabled=true and supply ESO SecretStore/ExternalSecret
# manifests via extraManifests or a separate overlay.
# ---------------------------------------------------------------------------
externalSecrets:
  enabled: false

# ---------------------------------------------------------------------------
# Bootstrap job — creates the `langfuse` database on shared Postgres.
# Disabled in prod: DBA pre-creates the DB before first Helm install.
# These values are read by our own templates (postgres-bootstrap-job.yaml),
# not by the upstream langfuse subchart.
# ---------------------------------------------------------------------------
bootstrap:
  postgres:
    enabled: false
    # Connection info for the shared Postgres host (same as langfuse.postgresql.*
    # but accessible at the parent chart level for the bootstrap Job template).
    host: "pg.your-domain.com"   # operator overrides with actual Postgres hostname
    port: 5432

# ---------------------------------------------------------------------------
# Langfuse upstream subchart passthrough
# All langfuse application settings must be nested under langfuse.langfuse.*
# because the subchart's own top-level key is `langfuse:`.
# ---------------------------------------------------------------------------
langfuse:
  global:
    security:
      allowInsecureImages: true

  # ---- NextAuth ----
  langfuse:
    nextauth:
      # Override in prod overlay: https://langfuse.your-domain.com
      url: "http://localhost:3000"
      secret:
        secretKeyRef:
          name: dataspoke-langfuse-secret
          key: LANGFUSE_NEXTAUTH_SECRET

    # ---- Hashing salt ----
    salt:
      secretKeyRef:
        name: dataspoke-langfuse-secret
        key: LANGFUSE_SALT

    # ---- Encryption key (64-hex-char) — encrypts stored LLM provider keys ----
    encryptionKey:
      secretKeyRef:
        name: dataspoke-langfuse-secret
        key: LANGFUSE_ENCRYPTION_KEY

    # ---- Ingress ----
    ingress:
      enabled: true
      className: "nginx"
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
        nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      hosts:
        - host: "langfuse.your-domain.com"
          paths:
            - path: /
              pathType: Prefix
      tls:
        enabled: true
        secretName: langfuse-tls

    # ---- Web resources (prod) ----
    web:
      service:
        port: 3000
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1024Mi

    # ---- Worker resources (prod) ----
    worker:
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1024Mi

    # ---- Replica count ----
    replicas: 2

  # ---- PostgreSQL — external in prod ----
  postgresql:
    deploy: false
    host: ""          # operator sets: e.g. pg.internal.your-domain.com
    port: 5432
    auth:
      username: "dataspoke"
      existingSecret: "dataspoke-postgres-secret"
      secretKeys:
        userPasswordKey: POSTGRES_PASSWORD
        adminPasswordKey: POSTGRES_PASSWORD
      database: "langfuse"

  # ---- Redis — external in prod ----
  # NetworkPolicy: restrict ingress to the DataSpoke namespace.
  # The upstream Langfuse chart has no parent-level networkPolicy.enabled knob;
  # these are the Bitnami sub-subchart knobs.
  # Verify the namespace label: kubectl get ns dataspoke-01 --show-labels
  redis:
    deploy: false
    host: "redis.your-domain.com"   # operator overrides with actual Redis hostname
    port: 6379
    auth:
      username: "default"
      existingSecret: "dataspoke-redis-secret"
      existingSecretPasswordKey: REDIS_PASSWORD
      database: 1
    networkPolicy:
      enabled: true
      allowExternal: false
      ingressNSMatchLabels:
        kubernetes.io/metadata.name: dataspoke-01

  # ---- ClickHouse — bundled, HA in prod (3 replicas) ----
  # NetworkPolicy: restrict ingress to the DataSpoke namespace.
  clickhouse:
    deploy: true
    replicaCount: 3
    clusterEnabled: true
    auth:
      password: ""
      existingSecret: "dataspoke-langfuse-secret"
      existingSecretKey: LANGFUSE_CLICKHOUSE_PASSWORD
    zookeeper:
      image:
        repository: bitnamilegacy/zookeeper
      networkPolicy:
        enabled: true
        allowExternal: false
        ingressNSMatchLabels:
          kubernetes.io/metadata.name: dataspoke-01
    persistence:
      enabled: true
      size: 50Gi
      storageClass: ""   # operator sets to cluster storage class
    networkPolicy:
      enabled: true
      allowExternal: false
      ingressNSMatchLabels:
        kubernetes.io/metadata.name: dataspoke-01

  # ---- S3 — external in prod (points at real S3 / GCS) ----
  s3:
    deploy: false
    bucket: "langfuse"
    region: ""          # operator sets
    endpoint: ""        # operator sets for S3-compatible; blank for AWS S3
    forcePathStyle: false
    accessKeyId:
      secretKeyRef:
        name: dataspoke-langfuse-secret
        key: LANGFUSE_S3_ACCESS_KEY_ID
    secretAccessKey:
      secretKeyRef:
        name: dataspoke-langfuse-secret
        key: LANGFUSE_S3_SECRET_ACCESS_KEY
