# Langfuse Chart — Dev Overlay
# Applied on top of values.yaml by helm-charts/bin/peripherals/langfuse.sh.
# Langfuse runs in its own namespace (langfuse-01) with bundled single-replica
# Postgres, Redis, ClickHouse, and MinIO subcharts. No dependency on dataspoke-01.
# Ingress host overridden at install time via --set-string.
#
# Key nesting: see values.yaml header for explanation of langfuse.langfuse.* nesting.

# ---------------------------------------------------------------------------
# Langfuse subchart values (nested under langfuse.<key> per subchart structure)
# ---------------------------------------------------------------------------
langfuse:
  global:
    security:
      allowInsecureImages: true

  langfuse:
    # ---- NextAuth ----
    nextauth:
      # install.sh overrides this to http://langfuse.<INGRESS_IP>.nip.io
      url: "http://langfuse.dev.dataspoke.example.com"
      secret:
        secretKeyRef:
          name: dataspoke-langfuse-secret
          key: LANGFUSE_NEXTAUTH_SECRET

    # ---- Hashing salt ----
    salt:
      secretKeyRef:
        name: dataspoke-langfuse-secret
        key: LANGFUSE_SALT

    # ---- Encryption key (64-hex-char) — encrypts stored LLM provider keys ----
    encryptionKey:
      secretKeyRef:
        name: dataspoke-langfuse-secret
        key: LANGFUSE_ENCRYPTION_KEY

    # ---- ClickHouse readiness gate (cold install) ----
    # web and worker run ClickHouse migrations in their entrypoint before
    # serving. On a cold install ClickHouse isn't accepting on :9000 yet,
    # so the migration fails (connection refused → exit 1) and K8s crash-loops
    # the pod. This init container blocks both deployments until ClickHouse
    # accepts TCP connections, eliminating the crash-loop on first install.
    extraInitContainers:
      - name: wait-for-clickhouse
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            echo "Waiting for ClickHouse at langfuse-clickhouse:9000..."
            until nc -z langfuse-clickhouse 9000; do
              echo "  clickhouse not ready — retrying in 3s"; sleep 3
            done
            echo "ClickHouse is reachable; proceeding."

    # ---- Ingress: no TLS in dev ----
    ingress:
      enabled: true
      className: "nginx"
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "false"
        nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      hosts:
        - host: "langfuse.dev.dataspoke.example.com"
          paths:
            - path: /
              pathType: Prefix
      tls:
        enabled: false
        secretName: ""

    # ---- Web resources + probes (dev) ----
    # Langfuse 3.x web is Next.js 16. On cold start the in-process init scripts
    # (default-model prices, evaluators, dashboards) run for ~30–60s and block
    # /api/public/health from responding; the chart-default 50s probe budget
    # (20s initialDelay + 3×10s failureThreshold) is too tight on Autopilot,
    # causing SIGTERM mid-init and a restart loop. Bump initialDelay + failure
    # threshold so liveness/readiness only fire after init has had time to
    # converge. Resources are also bumped from the bare-minimum 256Mi.
    web:
      service:
        port: 3000
      # langfuse 3.179.1 (Next.js 16) exhausts a 1Gi container's V8 heap during
      # the in-process init scripts ("FATAL ERROR: Reached heap limit ... JS heap
      # out of memory") and SIGABRTs (exit 134) into a restart loop. 2Gi gives
      # Node headroom to size its heap past startup.
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          cpu: 500m
          memory: 2Gi
      livenessProbe:
        initialDelaySeconds: 180
        periodSeconds: 15
        timeoutSeconds: 10
        failureThreshold: 10
      readinessProbe:
        initialDelaySeconds: 60
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 20
      # ---- Headless-init seeded org/project/user/API key (dev) ----
      # On first web start with an empty DB, Langfuse provisions:
      #   org=DataSpoke / project=dataspoke / user=dataspoke@dataspoke.local
      #   API public key=pk-lf-dataspoke-dev / secret key persisted in .env.
      # Login at the UI: dataspoke@dataspoke.local / dataspoke.
      # Subsequent restarts are no-ops once these entities exist.
      # The dataspoke-langfuse-secret is created in langfuse-01 by install.sh
      # with the full key set; pods resolve it locally within their namespace.
      pod:
        additionalEnv:
          - name: LANGFUSE_INIT_USER_EMAIL
            valueFrom:
              secretKeyRef:
                name: dataspoke-langfuse-secret
                key: LANGFUSE_INIT_USER_EMAIL
          - name: LANGFUSE_INIT_USER_NAME
            valueFrom:
              secretKeyRef:
                name: dataspoke-langfuse-secret
                key: LANGFUSE_INIT_USER_NAME
          - name: LANGFUSE_INIT_USER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: dataspoke-langfuse-secret
                key: LANGFUSE_INIT_USER_PASSWORD
          - name: LANGFUSE_INIT_ORG_ID
            valueFrom:
              secretKeyRef:
                name: dataspoke-langfuse-secret
                key: LANGFUSE_INIT_ORG_ID
          - name: LANGFUSE_INIT_ORG_NAME
            valueFrom:
              secretKeyRef:
                name: dataspoke-langfuse-secret
                key: LANGFUSE_INIT_ORG_NAME
          - name: LANGFUSE_INIT_PROJECT_ID
            valueFrom:
              secretKeyRef:
                name: dataspoke-langfuse-secret
                key: LANGFUSE_INIT_PROJECT_ID
          - name: LANGFUSE_INIT_PROJECT_NAME
            valueFrom:
              secretKeyRef:
                name: dataspoke-langfuse-secret
                key: LANGFUSE_INIT_PROJECT_NAME
          - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
            valueFrom:
              secretKeyRef:
                name: dataspoke-langfuse-secret
                key: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
          - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: dataspoke-langfuse-secret
                key: LANGFUSE_INIT_PROJECT_SECRET_KEY

    # ---- Worker resources (dev) ----
    worker:
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi

    # ---- Single replica in dev ----
    replicas: 1

  # ---- PostgreSQL — bundled in dev (runs inside langfuse-01 namespace) ----
  # The bundled subchart username is fixed to `postgres`; both userPasswordKey
  # and adminPasswordKey must be provided for the default postgres user.
  postgresql:
    deploy: true
    port: 5432
    auth:
      username: postgres
      password: ""
      existingSecret: "dataspoke-langfuse-secret"
      secretKeys:
        userPasswordKey: LANGFUSE_POSTGRES_PASSWORD
        adminPasswordKey: LANGFUSE_POSTGRES_PASSWORD
      database: "langfuse"
    primary:
      persistence:
        size: 6Gi

  # ---- Redis (Valkey) — bundled in dev (runs inside langfuse-01 namespace) ----
  redis:
    deploy: true
    port: 6379
    auth:
      username: "default"
      password: ""
      existingSecret: "dataspoke-langfuse-secret"
      existingSecretPasswordKey: LANGFUSE_REDIS_PASSWORD
      database: 0
    primary:
      persistence:
        size: 6Gi
    networkPolicy:
      enabled: false

  # ---- ClickHouse — single-replica in dev ----
  clickhouse:
    deploy: true
    replicaCount: 1
    clusterEnabled: false
    auth:
      password: ""
      existingSecret: "dataspoke-langfuse-secret"
      existingSecretKey: LANGFUSE_CLICKHOUSE_PASSWORD
    zookeeper:
      image:
        repository: bitnamilegacy/zookeeper
      networkPolicy:
        enabled: false
      persistence:
        size: 6Gi
    resourcesPreset: ""
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    persistence:
      enabled: true
      size: 8Gi
    networkPolicy:
      enabled: false

  # ---- S3 — bundled MinIO in dev (single replica) ----
  s3:
    deploy: true
    bucket: "langfuse"
    region: "auto"
    endpoint: ""    # auto-resolved from MinIO subchart service when deploy=true
    forcePathStyle: true
    auth:
      rootUser: minio
      rootPassword: ""
      existingSecret: "dataspoke-langfuse-secret"
      rootUserSecretKey: LANGFUSE_MINIO_ROOT_USER
      rootPasswordSecretKey: LANGFUSE_MINIO_ROOT_PASSWORD
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 256Mi
