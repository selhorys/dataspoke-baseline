# Langfuse Chart — Production Defaults
# Langfuse is treated as a separately-owned subsystem with its own bundled
# Postgres/Redis/ClickHouse/MinIO subcharts in dev. In production, operators
# supply a prod-overrides.yaml pointing at external endpoints, TLS secrets,
# and ESO wiring.
#
# Key nesting: the upstream Langfuse chart wraps its own config under a
# top-level `langfuse:` key, and Helm passes parent values under the
# dependency name (`langfuse:`) as-is into the subchart. So in this parent
# chart, Langfuse application settings live at `langfuse.langfuse.*`,
# infrastructure settings live at `langfuse.postgresql.*`, etc.

# ---------------------------------------------------------------------------
# Global — Bitnami subchart compatibility
# ---------------------------------------------------------------------------
global:
  security:
    allowInsecureImages: true

# ---------------------------------------------------------------------------
# External secrets integration
# Set externalSecrets.enabled=true and supply ESO SecretStore/ExternalSecret
# manifests via extraManifests or a separate overlay.
# ---------------------------------------------------------------------------
externalSecrets:
  enabled: false

# ---------------------------------------------------------------------------
# Langfuse upstream subchart passthrough
# All langfuse application settings must be nested under langfuse.langfuse.*
# because the subchart's own top-level key is `langfuse:`.
# ---------------------------------------------------------------------------
langfuse:
  global:
    security:
      allowInsecureImages: true

  # ---- Feature flags ----
  langfuse:
    features:
      # Disable open self-service sign-up to the LLM-trace UI. Operators
      # provision accounts via the Langfuse admin API or headless-init.
      # Using langfuse.features.signUpDisabled (idiomatic key, chart 1.5.x).
      # Do NOT also set additionalEnv[AUTH_DISABLE_SIGNUP] — the chart's
      # validations.yaml rejects having both set simultaneously.
      signUpDisabled: true

    nextauth:
      # Override in prod overlay: https://langfuse.your-domain.com
      url: "http://localhost:3000"
      secret:
        secretKeyRef:
          name: dataspoke-langfuse-secret
          key: LANGFUSE_NEXTAUTH_SECRET

    # ---- Hashing salt ----
    salt:
      secretKeyRef:
        name: dataspoke-langfuse-secret
        key: LANGFUSE_SALT

    # ---- Encryption key (64-hex-char) — encrypts stored LLM provider keys ----
    encryptionKey:
      secretKeyRef:
        name: dataspoke-langfuse-secret
        key: LANGFUSE_ENCRYPTION_KEY

    # ---- Ingress ----
    ingress:
      enabled: true
      className: "nginx"
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
        nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      hosts:
        - host: "langfuse.your-domain.com"
          paths:
            - path: /
              pathType: Prefix
      tls:
        enabled: true
        secretName: langfuse-tls

    # ---- Web resources (prod) ----
    web:
      # Eviction resilience. Langfuse chart 1.5.x pod annotation path:
      # langfuse.langfuse.web.pod.annotations (inside the `pod:` subkey).
      pod:
        annotations:
          cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      # PDB: langfuse.langfuse.web.pdb.{create,minAvailable}
      pdb:
        create: true
        minAvailable: 1
      service:
        port: 3000
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1024Mi

    # ---- Worker resources (prod) ----
    worker:
      # Langfuse chart 1.5.x pod annotation path: langfuse.langfuse.worker.pod.annotations
      pod:
        annotations:
          cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      # PDB: langfuse.langfuse.worker.pdb.{create,minAvailable}
      pdb:
        create: true
        minAvailable: 1
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1024Mi

    # ---- Replica count ----
    replicas: 2

  # ---- PostgreSQL — bundled by default; override deploy=false + host in prod for external ----
  postgresql:
    deploy: true
    host: ""          # operator sets when deploy=false: e.g. pg.internal.your-domain.com
    port: 5432
    auth:
      username: "langfuse"
      database: "langfuse"
    # Bitnami postgresql primary eviction resilience keys (verified against bundled chart).
    primary:
      podAnnotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      pdb:
        create: true
        minAvailable: 1

  # ---- Redis — bundled by default; override deploy=false + host in prod for external ----
  redis:
    deploy: true
    host: ""          # operator sets when deploy=false: e.g. redis.internal.your-domain.com
    port: 6379
    auth:
      username: "default"
      database: 1
    networkPolicy:
      enabled: false
    # Bitnami valkey primary eviction resilience (verified against bundled valkey chart).
    # primary.pdb.create defaults true in the valkey chart; the PDB renders.
    primary:
      podAnnotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      pdb:
        create: true
        minAvailable: 1

  # ---- ClickHouse — bundled, HA in prod (3 replicas) ----
  clickhouse:
    deploy: true
    replicaCount: 3
    clusterEnabled: true
    # Bitnami clickhouse top-level podAnnotations and pdb keys (verified against bundled chart).
    podAnnotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    pdb:
      create: true
      minAvailable: 1
    auth:
      password: ""
      existingSecret: "dataspoke-langfuse-secret"
      existingSecretKey: LANGFUSE_CLICKHOUSE_PASSWORD
    zookeeper:
      image:
        repository: bitnamilegacy/zookeeper
    persistence:
      enabled: true
      size: 50Gi
      storageClass: ""   # operator sets to cluster storage class

  # ---- S3 — external in prod (points at real S3 / GCS) ----
  s3:
    deploy: false
    bucket: "langfuse"
    region: ""          # operator sets
    endpoint: ""        # operator sets for S3-compatible; blank for AWS S3
    forcePathStyle: false
    accessKeyId:
      secretKeyRef:
        name: dataspoke-langfuse-secret
        key: LANGFUSE_S3_ACCESS_KEY_ID
    secretAccessKey:
      secretKeyRef:
        name: dataspoke-langfuse-secret
        key: LANGFUSE_S3_SECRET_ACCESS_KEY
