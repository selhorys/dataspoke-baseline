id: validation
namespace: dataspoke
description: "Data quality validation pipeline"

concurrency:
  limit: 2
  behavior: QUEUE

inputs:
  - id: callback_base_url
    type: STRING
  - id: dataset_urn
    type: STRING
  - id: config_id
    type: STRING
    defaults: ""
  - id: dry_run
    type: STRING
    defaults: "false"

tasks:
  - id: run_validation
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.callback_base_url }}/internal/activities/validation/run"
    method: POST
    contentType: application/json
    body: |
      {"dataset_urn": "{{ inputs.dataset_urn }}", "config_id": "{{ inputs.config_id }}", "dry_run": {{ inputs.dry_run }}}
    options:
      connectTimeout: PT5S
      readTimeout: PT30S
    retry:
      type: constant
      maxAttempt: 3
      interval: PT10S
