id: ingestion
namespace: dataspoke
description: "Dataset metadata ingestion — extract, emit, record"

inputs:
  - id: callback_base_url
    type: STRING
  - id: dataset_urn
    type: STRING
  - id: dry_run
    type: STRING
    defaults: "false"
  - id: run_id
    type: STRING

tasks:
  - id: extract_metadata
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.callback_base_url }}/internal/activities/extract-metadata"
    method: POST
    contentType: application/json
    body: |
      {"dataset_urn": "{{ inputs.dataset_urn }}", "run_id": "{{ inputs.run_id }}"}
    retry:
      type: constant
      maxAttempt: 3
      interval: PT10S

  - id: branch_dry_run
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.dry_run == 'true' }}"
    then:
      - id: record_dry_run
        type: io.kestra.plugin.core.http.Request
        uri: "{{ inputs.callback_base_url }}/internal/activities/record-ingestion-event"
        method: POST
        contentType: application/json
        body: |
          {"dataset_urn": "{{ inputs.dataset_urn }}", "run_id": "{{ inputs.run_id }}", "status": "success", "detail": {"dry_run": true}}
    else:
      - id: emit_to_datahub
        type: io.kestra.plugin.core.http.Request
        uri: "{{ inputs.callback_base_url }}/internal/activities/emit-to-datahub"
        method: POST
        contentType: application/json
        body: |
          {"dataset_urn": "{{ inputs.dataset_urn }}", "extract_result": {{ outputs.extract_metadata.body }}}
        retry:
          type: constant
          maxAttempt: 3
          interval: PT10S

      - id: record_ingestion_event
        type: io.kestra.plugin.core.http.Request
        uri: "{{ inputs.callback_base_url }}/internal/activities/record-ingestion-event"
        method: POST
        contentType: application/json
        body: |
          {"dataset_urn": "{{ inputs.dataset_urn }}", "run_id": "{{ inputs.run_id }}", "status": "success", "detail": {{ outputs.emit_to_datahub.body }}}
        retry:
          type: constant
          maxAttempt: 3
          interval: PT10S
