id: generation
namespace: dataspoke
description: "LLM-powered metadata generation"

concurrency:
  limit: 2
  behavior: QUEUE

inputs:
  - id: callback_base_url
    type: STRING
  - id: dataset_urn
    type: STRING

tasks:
  - id: run_generation
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.callback_base_url }}/internal/activities/generation/run"
    method: POST
    contentType: application/json
    body: |
      {"dataset_urn": "{{ inputs.dataset_urn }}"}
    options:
      connectTimeout: PT5S
      readTimeout: PT30S
    retry:
      type: constant
      maxAttempt: 3
      interval: PT10S
