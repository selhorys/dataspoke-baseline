id: ontology-rebuild
namespace: dataspoke
description: "Multi-step ontology rebuild: classify, hierarchy, relationships, drift"

inputs:
  - id: callback_base_url
    type: STRING
  - id: force
    type: STRING
    defaults: "false"

tasks:
  - id: classify_datasets
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.callback_base_url }}/internal/activities/classify-datasets"
    method: POST
    contentType: application/json
    body: |
      {"force": {{ inputs.force }}}
    retry:
      type: constant
      maxAttempt: 3
      interval: PT10S

  - id: build_hierarchy
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.callback_base_url }}/internal/activities/build-hierarchy"
    method: POST
    contentType: application/json
    body: |
      {"classifications": {{ outputs.classify_datasets.body }}}
    retry:
      type: constant
      maxAttempt: 3
      interval: PT10S

  - id: infer_relationships
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.callback_base_url }}/internal/activities/infer-relationships"
    method: POST
    contentType: application/json
    body: |
      {"hierarchy": {{ outputs.build_hierarchy.body }}}
    retry:
      type: constant
      maxAttempt: 3
      interval: PT10S

  - id: detect_drift
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.callback_base_url }}/internal/activities/detect-drift"
    method: POST
    contentType: application/json
    body: |
      {"current_hierarchy": {{ outputs.build_hierarchy.body }}}
    retry:
      type: constant
      maxAttempt: 3
      interval: PT10S
