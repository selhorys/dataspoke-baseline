id: metrics
namespace: dataspoke
description: "Metric collection and update publishing"

concurrency:
  limit: 2
  behavior: QUEUE

inputs:
  - id: callback_base_url
    type: STRING
  - id: metric_id
    type: STRING
  - id: dry_run
    type: STRING
    defaults: "false"

tasks:
  - id: run_metric
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.callback_base_url }}/internal/activities/metrics/run"
    method: POST
    contentType: application/json
    body: |
      {"metric_id": "{{ inputs.metric_id }}", "dry_run": {{ inputs.dry_run }}}
    options:
      connectTimeout: PT5S
      readTimeout: PT30S
    retry:
      type: constant
      maxAttempt: 3
      interval: PT10S

  - id: publish_metric_update
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.callback_base_url }}/internal/activities/metrics/publish-update"
    method: POST
    contentType: application/json
    body: |
      {{ outputs.run_metric.body }}
    options:
      connectTimeout: PT5S
      readTimeout: PT30S
    retry:
      type: constant
      maxAttempt: 3
      interval: PT10S
