id: embedding-sync
namespace: dataspoke
description: "Reindex dataset vectors in Qdrant"

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: callback_base_url
    type: STRING
  - id: mode
    type: STRING
    defaults: "full"
  - id: dataset_urn
    type: STRING
    defaults: ""

tasks:
  - id: enumerate_datasets
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.callback_base_url }}/internal/activities/enumerate-datasets"
    method: POST
    contentType: application/json
    body: |
      {"mode": "{{ inputs.mode }}", "dataset_urn": "{{ inputs.dataset_urn }}"}
    options:
      connectTimeout: PT5S
      readTimeout: PT30S

  - id: reindex_batch
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.callback_base_url }}/internal/activities/reindex-batch"
    method: POST
    contentType: application/json
    body: |
      {"dataset_urns": {{ outputs.enumerate_datasets.body }}}
    options:
      connectTimeout: PT5S
      readTimeout: PT30S
    retry:
      type: constant
      maxAttempt: 3
      interval: PT10S
