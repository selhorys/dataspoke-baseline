id: sla-monitor
namespace: dataspoke
description: "Periodic SLA monitoring with alerting"

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: callback_base_url
    type: STRING
    defaults: "http://dataspoke-api:8000"
  - id: dataset_urn
    type: STRING
    defaults: ""
  - id: sla_target
    type: STRING
    defaults: "{}"
  - id: alert_recipients
    type: STRING
    defaults: "[]"

tasks:
  - id: guard_dataset_urn
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.dataset_urn != '' }}"
    then:
      - id: check_sla
        type: io.kestra.plugin.core.http.Request
        uri: "{{ inputs.callback_base_url }}/internal/activities/check-sla"
        method: POST
        contentType: application/json
        body: |
          {"dataset_urn": "{{ inputs.dataset_urn }}", "sla_target": {{ inputs.sla_target }}}
        options:
          connectTimeout: PT5S
          readTimeout: PT30S
        retry:
          type: constant
          maxAttempt: 3
          interval: PT10S

      - id: send_sla_alerts
        type: io.kestra.plugin.core.http.Request
        uri: "{{ inputs.callback_base_url }}/internal/activities/send-sla-alerts"
        method: POST
        contentType: application/json
        body: |
          {"alerts": {{ outputs.guard_dataset_urn.check_sla.body }}, "recipients": {{ inputs.alert_recipients }}}
        options:
          connectTimeout: PT5S
          readTimeout: PT30S
        retry:
          type: constant
          maxAttempt: 3
          interval: PT10S

triggers:
  - id: sla_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true
