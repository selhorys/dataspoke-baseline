allowBuilds:
  sharp: true
  unrs-resolver: true

# Security-advisory pins for transitive dependencies (Dependabot). Each target
# is the patched release within the existing major, so parents resolve unchanged.
overrides:
  brace-expansion@1: ^1.1.16
  brace-expansion@2: ^2.1.2
  brace-expansion@5: ^5.0.7
  js-yaml@4: ^4.3.2
  nanoid@3: ^3.3.18
  postcss@<8.5.23: ^8.5.23
  sharp: ^0.35.4
  undici: ^7.29.0
  browserslist@4: ^4.28.7
  baseline-browser-mapping: ^2.11.0
  postcss-selector-parser@6: ^6.1.3
  vite: 8.0.16

minimumReleaseAgeExclude:
  - electron-to-chromium
  - which-typed-array
