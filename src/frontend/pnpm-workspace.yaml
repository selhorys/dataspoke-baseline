allowBuilds:
  sharp: true
  unrs-resolver: true

# Security-advisory pins for transitive dependencies (Dependabot). Each target
# is the patched release within the existing major, so parents resolve unchanged.
overrides:
  brace-expansion@1: ^1.1.16
  brace-expansion@2: ^2.1.2
  brace-expansion@5: ^5.0.7
  js-yaml@4: ^4.3.0
  postcss@<8.5.10: ^8.5.10
  sharp: ^0.35.0
  undici: ^7.28.0
  vite: 8.0.16

minimumReleaseAgeExclude:
  - electron-to-chromium
  - which-typed-array
