# DataHub prerequisites Helm values — dev sizing
# Chart: datahub/datahub-prerequisites version 0.2.1
# All components use replicaCount: 1 for minimal resource usage.
# Total memory limits (prerequisites): ~9 GiB

# Bitnami Kafka (replaces cp-kafka)
kafka:
  enabled: true
  heapOpts: "-Xms512m -Xmx1536m"
  broker:
    replicaCount: 1
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
    extraConfig: |
      message.max.bytes=5242880
      default.replication.factor=1
      offsets.topic.replication.factor=1
      transaction.state.log.replication.factor=1
      num.partitions=3
      num.io.threads=4
      num.network.threads=4
      num.replica.fetchers=1
      log.retention.hours=24
      log.retention.bytes=268435456
      log.segment.bytes=67108864
      log.cleaner.enable=true
  kraft:
    enabled: false
  # Listeners: CLIENT (9092) for in-cluster DataHub components, INTERNAL (9094)
  # for inter-broker, EXTERNAL (9095) for external access via nginx-ingress TCP passthrough.
  # advertisedListeners EXTERNAL is overridden by datahub/install.sh with the
  # actual ingress IP (from DATASPOKE_DEV_INGRESS_IP in .env).
  listeners:
    client:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
    external:
      containerPort: 9095
      protocol: PLAINTEXT
      name: EXTERNAL
    overrideListeners: "CLIENT://:9092,INTERNAL://:9094,EXTERNAL://:9095"
    securityProtocolMap: "CLIENT:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
    # yamllint disable-line rule:line-length
    advertisedListeners: "CLIENT://datahub-prerequisites-kafka-broker-0.datahub-prerequisites-kafka-broker-headless.datahub-01.svc.cluster.local:9092,INTERNAL://datahub-prerequisites-kafka-broker-0.datahub-prerequisites-kafka-broker-headless.datahub-01.svc.cluster.local:9094,EXTERNAL://localhost:9005"
  # Bitnami ZooKeeper (subchart of kafka)
  zookeeper:
    enabled: true
    replicaCount: 1
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

# Confluent Platform is disabled (bitnami kafka used instead)
cp-helm-charts:
  enabled: false
  cp-schema-registry:
    enabled: false

# Elasticsearch
# ES needs ~512m JVM heap + ~1.5 GB off-heap (Lucene segment cache, network
# buffers, plugin loading, index recovery).  2Gi OOM-killed during concurrent
# startup with Kafka/MySQL; 2.5Gi gives stable headroom.
elasticsearch:
  enabled: true
  replicas: 1
  minimumMasterNodes: 1
  antiAffinity: "soft"
  clusterHealthCheckParams: "wait_for_status=yellow&timeout=1s"
  esJavaOpts: "-Xmx2g -Xms2g"
  # --- GKE Autopilot compatibility ---
  # 1. Disable the privileged sysctl init container (Autopilot blocks it).
  sysctlInitContainer:
    enabled: false
  # 2. Use single-node discovery to skip bootstrap checks (vm.max_map_count).
  esConfig:
    elasticsearch.yml: |
      discovery.type: single-node
  # 3. Set roles.master="false" so the chart template does NOT emit
  #    cluster.initial_master_nodes (conflicts with single-node mode).
  #    Restore node.master=true via extraEnvs (appended after the roles
  #    block in the StatefulSet template, so it wins).
  roles:
    master: "false"
    ingest: "true"
    data: "true"
    remote_cluster_client: "true"
    ml: "true"
  extraEnvs:
    - name: node.master
      value: "true"
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

# Bitnami MySQL
mysql:
  enabled: true
  auth:
    existingSecret: "mysql-secrets"
    # Secret must contain keys: mysql-root-password, mysql-password
  primary:
    extraFlags: "--character-set-server=utf8mb4 --collation-server=utf8mb4_bin"
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1536Mi"
    persistence:
      enabled: true
      size: 10Gi
    # Relaxed probes for stable dev cluster startup
    startupProbe:
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 15
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5

# Neo4j disabled — using Elasticsearch as graph backend (upstream default)
neo4j:
  enabled: false
