# DataHub Helm values — dev sizing
# Chart: datahub/datahub version 0.8.21 (app version v1.4.0.3)
# Total memory limits (datahub services): ~6.5 GiB
#
# Service name overrides point to the datahub-prerequisites release.
# Because the prerequisites chart is installed as release name
# "datahub-prerequisites", all internal service names get the
# "datahub-prerequisites-" prefix.

global:
  sql:
    datasource:
      host: "datahub-prerequisites-mysql:3306"
      hostForMysqlClient: "datahub-prerequisites-mysql"
      port: "3306"
      url: "jdbc:mysql://datahub-prerequisites-mysql:3306/datahub?verifyServerCertificate=false&useSSL=true&useUnicode=yes&characterEncoding=UTF-8&enabledTLSProtocols=TLSv1.2"
      driver: "com.mysql.cj.jdbc.Driver"
      username: "root"
      password:
        secretRef: "mysql-secrets"
        secretKey: "mysql-root-password"
  elasticsearch:
    host: "elasticsearch-master"
    port: "9200"
  kafka:
    bootstrap:
      server: "datahub-prerequisites-kafka:9092"
    zookeeper:
      server: "datahub-prerequisites-zookeeper:2181"
    schemaregistry:
      type: INTERNAL
  graph_service_impl: elasticsearch

datahub-gms:
  extraEnvs:
    # Disable the system-update wait that gates the MAE consumer startup.
    # In dev, the system-update job always completes before GMS boots, so
    # the gate is unnecessary. Without this, the embedded MAE consumer
    # (which indexes timeseries aspects like OperationClass into ES) is
    # stopped during the upgrade check and never restarted — a DataHub bug
    # in the DataHubUpgradeKafkaListener → KafkaInitializationManager flow.
    - name: BOOTSTRAP_SYSTEM_UPDATE_WAIT_FOR_SYSTEM_UPDATE
      value: "false"
  resources:
    requests:
      cpu: "1000m"
      memory: "1536Mi"
    limits:
      cpu: "2000m"
      memory: "3Gi"
  # Relaxed probes: GMS depends on ES, Kafka, and MySQL.  On a single-node
  # dev cluster a transient ES restart can make /health unreachable for
  # 30-60 s.  failureThreshold × periodSeconds ≈ 2 min tolerance prevents
  # unnecessary GMS restarts during infra recovery.
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 8
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 4

datahub-frontend:
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 6
  ingress:
    enabled: true
    ingressClassName: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Host is overridden by install.sh --set using DATASPOKE_DEV_INGRESS_DOMAIN.
    # The placeholder below is intentionally obvious so a missed --set fails loud.
    hosts:
      - host: "REPLACE-WITH-INGRESS-DOMAIN.invalid"
        paths:
          - /

datahub-mae-consumer:
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

datahub-mce-consumer:
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

datahub-actions:
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
